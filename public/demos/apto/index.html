/* ---------- Banco ---------- */
const FILTERS = [["all", "Todas"], ["t1", "T1"], ["t2", "T2"], ["t3", "T3"], ["t4", "T4"], ["t5", "T5"], ["new", "Nuevas"], ["ko", "Fallos"], ["dud", "Dudosas"], ["apr", "Aprendiendo"], ["dom", "Dominadas"]];
function bancoItems() {
  const f = ui.banco.f;
  const term = norm(ui.banco.q.trim());
  return QS.filter((q) => {
    if (/^t\d$/.test(f) && q.t !== +f[1]) return false;
    if (STATUS[f] && status(q) !== f) return false;
    if (term && !norm(`${q.id} ${q.q} ${q.o.join(" ")}`).includes(term)) return false;
    return true;
  });
}
function listHTML() {
  const items = bancoItems();
  if (!items.length) return `<p class="muted">Ninguna pregunta coincide.</p>`;
  return `<p class="muted">${items.length} ${items.length === 1 ? "pregunta" : "preguntas"}</p><div class="qlist">${items.map((q) => `<button class="qitem" data-act="detail" data-arg="${q.id}"><span class="id num">${q.id}</span><span>${esc(q.q)}</span>${chip(q)}</button>`).join("")}</div>`;
}
function vBanco() {
  return `<h1 class="h1">Preguntas del manual</h1>
  <input id="q-search" class="search" type="search" placeholder="Buscar: Senado, Ebro, TIE…" value="${esc(ui.banco.q)}" autocomplete="off" aria-label="Buscar preguntas">
  <div class="chips">${FILTERS.map(([k, l]) => `<button class="chip" data-act="bancoFilter" data-arg="${k}" aria-pressed="${ui.banco.f === k}">${l}</button>`).join("")}</div>
  <div id="qlist">${listHTML()}</div>`;
}
function vDetalle() {
  const q = QMAP.get(ui.detail);
  const c = card(q.id);
  const L = LET(q);
  return `<button class="back" data-act="go" data-arg="banco">Preguntas</button>
  <div class="qmeta">T${q.t} · ${TASKS[q.t].short} · nº ${q.id}</div>
  <div class="stem">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o, oi) => `<div class="opt ${oi === q.a ? "ok" : ""}"><span class="k">${L[oi]}</span><span>${esc(o)}</span></div>`).join("")}</div>
  ${explBlock(q)}
  <section class="panel"><div class="row"><span class="label">Tu historial</span>${chip(q)}</div>
    ${c && c.n
      ? `<p class="muted">Respondida ${c.n} ${c.n === 1 ? "vez" : "veces"} · ${c.ok} bien · ${c.ko} mal · ${c.due > Date.now() ? `próximo repaso: ${esc(fmtShort(c.due))}` : "toca repasarla"}</p>`
      : `<p class="muted">Todavía no la has estudiado.</p>`}
  </section>
  <div class="duo"><button class="btn secondary" data-act="speakId" data-arg="${q.id}">Escuchar</button><button class="btn" data-act="start" data-arg="ids:${q.id}">Practicar</button></div>`;
}

/* ---------- Ajustes ---------- */
function vAjustes() {
  const st = state.settings;
  return `<h1 class="h1">Ajustes</h1>
  <section class="panel">
    <label class="field"><span class="label">Fecha del examen</span><input type="date" data-set="examDate" value="${esc(st.examDate)}"></label>
    <label class="field"><span class="label">Hora</span><select data-set="examTime">${["18:00", "20:00"].map((h) => `<option ${st.examTime === h ? "selected" : ""}>${h}</option>`).join("")}</select></label>
    <p class="muted">Según la guía oficial, la prueba se celebra el último jueves de cada mes (salvo agosto y diciembre), a las 18:00 o a las 20:00. En septiembre de 2026 es el jueves 24.</p>
  </section>
  <section class="panel">
    <label class="toggle"><input type="checkbox" data-set="recall" ${st.recall ? "checked" : ""}><span><strong>Recordar antes de ver opciones</strong><span class="muted">Solo en preguntas que ya conoces.</span></span></label>
    <label class="toggle"><input type="checkbox" data-set="shuffle" ${st.shuffle ? "checked" : ""}><span><strong>Barajar opciones al estudiar</strong><span class="muted">El simulacro mantiene el orden del manual.</span></span></label>
    <label class="field"><span class="label">Velocidad de la voz</span><select data-set="rate">${[[0.8, "Lenta"], [1, "Normal"], [1.2, "Rápida"]].map(([v, l]) => `<option value="${v}" ${st.rate === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
  </section>
  <section class="panel">
    <div class="label">Tu progreso</div>
    <p class="muted">${sync.status === "ok" ? "Se guarda en este dispositivo y se sincroniza con tus otros dispositivos cuando abres la app." : "Se guarda en este dispositivo."}</p>
    ${ui.resetConfirm
      ? `<p><strong>¿Borrar todo el progreso?</strong> No se puede deshacer.</p><div class="duo"><button class="btn secondary" data-act="resetCancel">Cancelar</button><button class="btn danger" data-act="resetDo">Borrar progreso</button></div>`
      : `<button class="btn secondary" data-act="resetAsk">Borrar progreso…</button>`}
  </section>
  <p class="muted small">Preguntas y temario del Manual de preparación de la prueba CCSE 2026, © Instituto Cervantes. App personal de estudio, sin relación con el Instituto Cervantes.</p>`;
}

/* ================= Actions ================= */
const ACTIONS = {
  go: (v) => {
    if (v === "temario") ui.tem = { t: null, s: null };
    if (v === "ajustes") ui.resetConfirm = false;
    go(v);
  },
  start: (arg) => {
    const [kind, x] = arg.split(":");
    startSession(arg, buildQueue(kind, kind === "ids" ? x : x ? +x : undefined));
  },
  reveal: () => { ui.session.revealed = true; render(); },
  answer: (oi) => {
    const s = ui.session;
    if (!s || s.answered) return;
    const q = QMAP.get(s.ids[s.i]);
    const choice = +oi;
    const correct = choice === q.a;
    s.answered = { choice, correct };
    if (!correct) {
      grade(q.id, false);
      s.done++;
      const times = s.requeued[q.id] || 0;
      if (times < 2) {
        s.requeued[q.id] = times + 1;
        s.ids.splice(Math.min(s.ids.length, s.i + 4), 0, q.id);
      }
    }
    render();
  },
  conf: (k) => {
    const s = ui.session;
    if (!s || !s.answered || !s.answered.correct) return;
    grade(s.ids[s.i], true, k);
    s.ok++;
    s.done++;
    next();
  },
  next: () => next(),
  speakQ: () => {
    const s = ui.session;
    const q = QMAP.get(s.ids[s.i]);
    speak(s.revealed ? qText(q, s.order) : q.q);
  },
  speakId: (id) => speak(qText(QMAP.get(+id))),
  speakSec: () => {
    const sec = DATA.temario[ui.tem.t - 1].sections[ui.tem.s];
    speak(`${sec.h}. ${sec.paras.join(" ")}`);
  },
  simStart: () => {
    const ids = [];
    TK.forEach((k) => ids.push(...shuffle(QS.filter((q) => q.t === k).map((q) => q.id)).slice(0, TASKS[k].n)));
    state.simRun = { id: Date.now(), ids, answers: {}, start: Date.now(), cur: 0 };
    ui.simConfirm = false;
    saveLocal();
    go("simrun");
  },
  simPick: (oi) => {
    const r = state.simRun;
    if (!r) return;
    r.answers[r.ids[r.cur]] = +oi;
    if (r.cur < 24) r.cur++;
    saveLocal();
    render();
    window.scrollTo(0, 0);
  },
  simGo: (j) => {
    const r = state.simRun;
    if (!r) return;
    r.cur = Math.max(0, Math.min(24, +j));
    ui.simConfirm = false;
    saveLocal();
    render();
    window.scrollTo(0, 0);
  },
  simAsk: () => {
    const r = state.simRun;
    if (r.ids.some((id) => r.answers[id] == null)) {
      ui.simConfirm = true;
      render();
      window.scrollTo(0, 0);
    } else simSubmit();
  },
  simCancelAsk: () => { ui.simConfirm = false; render(); },
  simSubmit: () => simSubmit(),
  simShow: (id) => { ui.simResult = +id; go("simres"); },
  temTask: (t) => { ui.tem = { t: +t, s: null }; go("temario"); },
  temSec: (i) => { ui.tem.s = +i; go("temario"); },
  temBack: () => {
    if (ui.tem.s != null) ui.tem.s = null;
    else ui.tem.t = null;
    go("temario");
  },
  bancoFilter: (k) => { ui.banco.f = k; go("banco"); },
  detail: (id) => { ui.detail = +id; go("detalle"); },
  resetAsk: () => { ui.resetConfirm = true; render(); },
  resetCancel: () => { ui.resetConfirm = false; render(); },
  resetDo: () => {
    state = { ...defaultState(), settings: state.settings, resetAt: Date.now() };
    ui.resetConfirm = false;
    ui.session = null;
    save();
    toast("Progreso borrado");
    go("hoy");
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) {
    e.preventDefault();
    fn(el.dataset.arg);
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q-search") {
    ui.banco.q = e.target.value;
    document.getElementById("qlist").innerHTML = listHTML();
  }
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-set]");
  if (!el) return;
  const k = el.dataset.set;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (k === "rate") v = +v;
  if (k === "examDate" && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  state.settings[k] = v;
  state.settings.t = Date.now();
  if (k === "examDate" || k === "examTime") {
    const d = state.days[dayKey()];
    if (d) d.quota = null;
    header();
    toast("Fecha del examen guardada");
  }
  save();
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = { 1: 0, 2: 1, 3: 2, a: 0, b: 1, c: 2 }[e.key.toLowerCase()];
  if (ui.view === "sesion" && ui.session) {
    const s = ui.session;
    if (!s.revealed) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); ACTIONS.reveal(); }
      return;
    }
    if (!s.answered) {
      if (n != null && n < s.order.length) ACTIONS.answer(String(s.order[n]));
      return;
    }
    if (!s.answered.correct && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ACTIONS.next(); return; }
    if (s.answered.correct) {
      const k = { 1: "sabia", 2: "dudaba", 3: "adivine" }[e.key];
      if (k) ACTIONS.conf(k);
    }
  } else if (ui.view === "simrun" && state.simRun && n != null) {
    const q = QMAP.get(state.simRun.ids[state.simRun.cur]);
    if (n < q.o.length) ACTIONS.simPick(String(n));
  }
});
setInterval(() => {
  if (!state.simRun) return;
  const rem = simRemaining();
  if (rem <= 0) return simSubmit();
  if (ui.view === "simrun") {
    const el = document.getElementById("timer");
    if (el) {
      el.textContent = fmtClock(rem);
      el.classList.toggle("low", rem < 5 * MIN);
    }
  }
}, 1000);

render();
sync.init();
</script>
