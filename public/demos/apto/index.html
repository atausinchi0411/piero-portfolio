<title>Apto · demo</title>
<meta name="description" content="App personal de estudio para la prueba CCSE: las 300 preguntas del manual 2026, repaso intensivo, simulacro y temario.">
<meta name="theme-color" content="#F3F5F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#1B2027; --ink-2:#4A5462; --ink-3:#687384;
  --rule:#D5DCE6; --rule-strong:#A9B6C7;
  --form:#1F4E8C; --form-tint:#E2EBF6;
  --apto:#16794B; --apto-tint:#E0F1E8; --noapto:#B3261E; --noapto-tint:#F8E3E1; --warn:#945709; --warn-tint:#F6EBD9;
  --on-solid:#FFFFFF;
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1216; --surface:#171B21; --ink:#E4E8EE; --ink-2:#AAB4C2; --ink-3:#8692A3;
    --rule:#29313B; --rule-strong:#3C4754;
    --form:#8FB3E6; --form-tint:#1A283A;
    --apto:#5DC795; --apto-tint:#132A1F; --noapto:#F08A80; --noapto-tint:#2F1716; --warn:#E2A857; --warn-tint:#2B2113;
    --on-solid:#0F1216;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1216; --surface:#171B21; --ink:#E4E8EE; --ink-2:#AAB4C2; --ink-3:#8692A3;
  --rule:#29313B; --rule-strong:#3C4754;
  --form:#8FB3E6; --form-tint:#1A283A;
  --apto:#5DC795; --apto-tint:#132A1F; --noapto:#F08A80; --noapto-tint:#2F1716; --warn:#E2A857; --warn-tint:#2B2113;
  --on-solid:#0F1216;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-ui);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--form);outline-offset:2px}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:14px}
.small{font-size:12.5px}
.label{font:500 11px/1.3 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.h1{font-size:28px;line-height:1.1;font-weight:750;font-stretch:112%;margin:4px 0 0;text-wrap:balance}
.h2{font-size:21px;line-height:1.2;font-weight:700;margin:0;text-wrap:balance}
.h3{font-size:17px;font-weight:650}
.lead{font-size:16.5px}
.note{font-size:14px;color:var(--warn);background:var(--warn-tint);border-radius:10px;padding:10px 12px}

/* ---------- Shell ---------- */
.shell{max-width:680px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:4px 0;font-weight:800;font-size:21px;font-stretch:125%;letter-spacing:-.01em}
.brand i{width:15px;height:15px;background:var(--ink)}
.top-right{display:flex;align-items:center;gap:10px;min-width:0}
.exam-chip{font:500 12px/1.2 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.sync{font:500 11px/1.2 var(--f-mono);color:var(--apto);white-space:nowrap}
.sync.error{color:var(--warn)}
.gear{background:none;border:1px solid var(--rule-strong);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
main{padding:18px 18px calc(96px + env(safe-area-inset-bottom));display:grid;gap:16px;align-content:start}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:10px 2px 11px;display:grid;justify-items:center;gap:5px;font-size:12px;font-weight:550;color:var(--ink-3)}
.tab i{width:15px;height:15px;border:1.5px solid currentColor}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] i{background:currentColor}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:20;max-width:90vw}

/* ---------- Building blocks ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:10px;text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font-size:40px;line-height:1;font-weight:750;font-stretch:115%}
.count{font:600 15px var(--f-mono)}
.tone-ok{color:var(--apto)} .tone-warn{color:var(--warn)} .tone-bad{color:var(--noapto)}
.btn{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:650;background:var(--ink);color:var(--paper);width:100%;text-align:center;line-height:1.25}
.btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--rule-strong)}
.btn.danger{background:var(--noapto);color:var(--on-solid)}
.btn.small{width:auto;padding:7px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:default}
.linkish{background:none;border:0;padding:0;color:var(--form);text-decoration:underline;text-underline-offset:3px;font-size:inherit;font-family:inherit}
.back{justify-self:start;background:none;border:0;padding:4px 0;color:var(--form);font-weight:600;font-size:15px}
.back::before{content:"‹ "}
.banner{display:grid;gap:2px;text-align:left;background:var(--form-tint);border:1.5px solid var(--form);border-radius:12px;padding:12px 14px;color:var(--ink)}
.banner span{font-size:14px;color:var(--ink-2)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo > div{display:grid;gap:4px}
.tile{justify-items:start}
.tile:disabled{opacity:.5;cursor:default}
.bar{display:block;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--form);border-radius:4px}
.goal{position:relative;height:12px;background:var(--rule);border-radius:6px}
.goal i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.goal b{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--ink)}
.tone-bg-ok{background:var(--apto)} .tone-bg-warn{background:var(--warn)} .tone-bg-bad{background:var(--noapto)}
.taskbars{display:grid;gap:9px}
.taskbar{display:grid;grid-template-columns:112px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:13.5px}
.taskbar .num{text-align:right;font-family:var(--f-mono);font-size:13px}
.cover{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.cover i{display:block;min-width:3px}
.c-dom{background:var(--apto)} .c-apr{background:var(--form)} .c-dud{background:var(--warn)} .c-ko{background:var(--noapto)} .c-new{background:var(--rule-strong)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}
.lg{display:flex;align-items:center;gap:6px;background:none;border:0;padding:3px 0;font-size:13.5px;color:var(--ink-2)}
.lg i{width:10px;height:10px;border-radius:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week span{display:grid;gap:4px;justify-items:center;font:500 11px var(--f-mono);color:var(--ink-3)}
.week b{width:100%;height:28px;border:1.5px solid var(--rule-strong);border-radius:5px}
.week b.on{background:var(--form);border-color:var(--form)}
.week b.today{outline:2px solid var(--ink);outline-offset:1px}

.tlist,.qlist{display:grid;border-top:1px solid var(--rule)}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left}
.tk{font:600 14px var(--f-mono);color:var(--form);align-self:start;padding-top:2px}
.tbody{display:grid;gap:4px}
.tbody strong{font-weight:650;font-size:16px;line-height:1.3}
.go{font-size:14px;font-weight:650;color:var(--form)}
.qitem,.hitem,.sitem{display:grid;gap:10px;align-items:start;padding:12px 2px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;font-size:15px;line-height:1.35;width:100%}
.qitem{grid-template-columns:44px minmax(0,1fr) auto}
.hitem{grid-template-columns:minmax(0,1fr) auto auto;align-items:center}
.sitem{grid-template-columns:30px minmax(0,1fr)}
.qitem .id,.sitem .num,.hitem .id{font:500 12.5px var(--f-mono);color:var(--ink-3);padding-top:2px}
.state{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--rule-strong);color:var(--ink-3);white-space:nowrap}
.s-dom{color:var(--apto);border-color:var(--apto)}
.s-apr{color:var(--form);border-color:var(--form)}
.s-dud{color:var(--warn);border-color:var(--warn)}
.s-ko{color:var(--noapto);border-color:var(--noapto)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--rule-strong);background:var(--surface);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--rule-strong);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:550;background:var(--surface);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{display:grid;gap:6px}
.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--rule-strong);background:var(--surface);font-size:16px}
.toggle{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;padding:4px 0}
.toggle input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--form)}
.toggle span{display:grid;gap:2px}

/* ---------- Question ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qmeta{font:500 12px/1.4 var(--f-mono);color:var(--ink-3)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink)}
.stem{font-size:22px;line-height:1.3;font-weight:650;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;padding:13px 14px;border:1.5px solid var(--rule-strong);border-radius:12px;background:var(--surface);font-size:16.5px;line-height:1.35;font-weight:500}
.opt .k{width:28px;height:28px;border:1.5px solid var(--form);display:grid;place-items:center;font:500 13px var(--f-mono);color:var(--form)}
.opt.ok{border-color:var(--apto);background:var(--apto-tint)}
.opt.ok .k{background:var(--apto);border-color:var(--apto);color:var(--on-solid)}
.opt.bad{border-color:var(--noapto);background:var(--noapto-tint)}
.opt.bad .k{background:var(--noapto);border-color:var(--noapto);color:var(--on-solid)}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);border-color:var(--ink);color:var(--paper)}
button.opt:disabled{cursor:default}
.opts.small .opt{padding:9px 11px;font-size:14.5px}
.opts.small .opt .k{width:22px;height:22px;font-size:11.5px}
.recall{display:grid;gap:10px;padding:18px;border:1.5px dashed var(--rule-strong);border-radius:12px}
.feedback{font-size:17px;font-weight:650}
.feedback.ok{color:var(--apto)} .feedback.bad{color:var(--noapto)}
.expl{font:400 16px/1.55 var(--f-read);background:var(--form-tint);border-radius:12px;padding:14px 16px;color:var(--ink)}
.expl .src{display:block;margin-top:8px;font:500 12px/1.5 var(--f-mono);color:var(--ink-3)}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf .btn{padding:13px 4px;font-size:15px}
.k-sabia{background:var(--apto)!important;color:var(--on-solid)!important}
.k-dudaba{background:var(--warn)!important;color:var(--on-solid)!important}
.k-adivine{background:transparent!important;color:var(--ink)!important;border:1.5px solid var(--rule-strong)!important}

/* ---------- Simulacro ---------- */
.simbar{position:sticky;top:57px;z-index:4;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--paper);padding:6px 0 10px;border-bottom:1px solid var(--rule)}
.timer{font:600 22px var(--f-mono)}
.timer.low{color:var(--noapto)}
.sheet{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.sheet button{aspect-ratio:1;border:1.5px solid var(--form);background:var(--surface);font:500 11px var(--f-mono);color:var(--form);border-radius:3px;padding:0}
.sheet button.done{background:var(--form);color:var(--on-solid)}
.sheet button.cur{outline:2px solid var(--ink);outline-offset:1px}
.dist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dist span{display:grid;justify-items:center;gap:2px;border:1.5px solid var(--form);border-radius:8px;padding:8px 2px;font:500 12px var(--f-mono);color:var(--form)}
.dist b{font:750 22px var(--f-ui);color:var(--ink)}
.warnbox{border-color:var(--warn);background:var(--warn-tint)}
.verdict{border:2.5px solid var(--apto);color:var(--apto);border-radius:16px;padding:18px;display:grid;gap:6px;background:var(--surface)}
.verdict.no{border-color:var(--noapto);color:var(--noapto)}
.verdict .label{color:inherit}
.verdict .v{font-size:52px;line-height:.95;font-weight:800;font-stretch:125%}
.verdict > span:last-child{color:var(--ink-2)}
.revlist{display:grid;gap:8px}
.rev{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0 14px}
.rev summary{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;list-style:none;cursor:pointer;font-size:15px;line-height:1.35}
.rev summary::-webkit-details-marker{display:none}
.rev summary .num{font:500 12.5px var(--f-mono);color:var(--ink-3);padding-top:2px}
.rev[open]{padding-bottom:14px}
.rev[open] .opts{margin-bottom:10px}

/* ---------- Temario ---------- */
.reading{display:grid;gap:14px}
.reading p{font:400 18px/1.65 var(--f-read);max-width:62ch}
.reading p.bullet{padding-left:1.1em;text-indent:-1.1em}
.reading .h2{font-size:17px;letter-spacing:.03em}
.sitem span:last-child{font-weight:600;font-size:14.5px;letter-spacing:.02em}

@media (min-width:700px){
  main{padding-top:26px}
  .stem{font-size:24px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>

spaña?","o":["16 años.","18 años.","21 años."],"a":0,"p":97},{"id":5075,"t":5,"q":"¿Cuál es el sector de mayor peso en la economía española?","o":["Agricultura.","Servicios.","Construcción."],"a":1,"p":97},{"id":5076,"t":5,"q":"España es innovadora en el sector de…","o":["la ingeniería aeroespacial.","las energías renovables.","la energía nuclear."],"a":1,"p":97},{"id":5077,"t":5,"q":"¿Cómo se llama la ley laboral más importante de España?","o":["La Constitución.","El Estatuto de los Trabajadores.","El Servicio Público de Empleo Estatal."],"a":1,"p":97},{"id":5078,"t":5,"q":"¿Cuál de estos establecimientos está abierto 24 horas si es necesario?","o":["Farmacia.","Pescadería.","Librería."],"a":0,"p":97},{"id":5079,"t":5,"q":"La educación infantil en España…","o":["es obligatoria.","tiene dos ciclos.","empieza a los 4 años."],"a":1,"p":97},{"id":5080,"t":5,"q":"¿Cuándo empieza el calendario escolar?","o":["En agosto.","En septiembre.","En octubre."],"a":1,"p":98},{"id":5081,"t":5,"q":"Las Escuelas Oficiales de Idiomas…","o":["son centros de enseñanza privada.","son para mayores de 16 años.","dependen del Instituto Cervantes."],"a":1,"p":98},{"id":5082,"t":5,"q":"¿Cuál es el documento que recoge los años de cotización a la Seguridad Social?","o":["Informe de vida laboral.","Recibo de finiquito.","Certificado de profesionalidad."],"a":0,"p":98},{"id":5083,"t":5,"q":"Los convenios colectivos de una empresa son los que se firman con los representantes de los trabajadores sobre…","o":["las condiciones laborales.","el futuro de la empresa.","la relación con los clientes."],"a":0,"p":98},{"id":5084,"t":5,"q":"¿En cuál de estos sectores destaca España?","o":["En el turismo.","En la industria automovilística.","En tecnología digital."],"a":0,"p":98}],"temario":[{"t":1,"title":"Gobierno, legislación y participación ciudadana","sections":[{"h":"Introducción","paras":["La Constitución española fue aprobada en referéndum por los españoles el 6 de diciembre de 1978.","La Constitución es la «ley de leyes» o ley fundamental de España, a partir de la cual se establece el ordenamiento de todo el sistema jurídico español.","Los principios en los que se basa la Constitución española son:","• El respeto a los derechos humanos y las leyes.","• La protección de las diferencias de los pueblos de España.","• El desarrollo de un sistema social y económico para una vida digna.","• La colaboración y cooperación entre todos los pueblos de la Tierra.","El Reino de España es un Estado social y democrático de Derecho con la forma política de monarquía parlamentaria. Tiene como valores superiores la libertad, la justicia, la igualdad y el pluralismo político. En España, la soberanía nacional corresponde al pueblo español y de él derivan todos los poderes del Estado.","España es una patria común e indivisible, y la Constitución reconoce y garantiza el derecho a la autonomía de las nacionalidades y regiones que la componen, y la solidaridad entre todas ellas.","La bandera de España tiene tres franjas (roja, amarilla y roja). Cada comunidad autónoma tiene su propia bandera y debe","utilizarla junto a la española en sus edificios públicos y en sus actos oficiales.","En la Constitución se indica que el castellano es la lengua oficial de España. Todos los españoles tienen el derecho de usarla y el deber de conocerla. Las demás lenguas españolas serán también oficiales en las comunidades autónomas donde se usen, de acuerdo con sus respectivos estatutos. En España la enseñanza de las lenguas cooficiales es competencia de las comunidades autónomas.","Además del castellano o español, se hablan otras lenguas oficiales en las siguientes comunidades autónomas: Galicia (gallego), Navarra y País Vasco (vasco o euskera), Cataluña (catalán y aranés), Islas Baleares (catalán), Comunidad Valenciana (catalán o valenciano).","En España existen diferentes instituciones encargadas de la regulación de las lenguas, así como de su difusión y de la promoción de la cultura, que se presentan en la Tabla 1.","La capital de España es Madrid desde mediados del siglo XVI, antes lo fueron Valladolid y Toledo.","TABLA 1. Instituciones para la normalización y promoción de las lenguas españolas","El rey de España es el jefe del Estado, tiene la máxima representación. Su papel consiste en actuar como mediador y garantizar el buen funcionamiento de las instituciones. Además, entre otras funciones, aprobar y ordenar la publicación oficial de las leyes, nombra a los miembros del Gobierno, a propuesta de su presidente, y tiene el mando supremo de las Fuerzas Armadas de España. La Corona es el símbolo de la unidad de España.","En España se permite reinar tanto a hombres como a mujeres. La Corona de España es hereditaria, y el heredero o heredera de la Corona tiene el título de Príncipe o Princesa de Asturias. El rey tiene su residencia oficial en el Palacio Real, pero vive en el Palacio de la Zarzuela.","Juan Carlos I fue rey de España desde el 22 de noviembre de 1975 hasta el 18 de junio de 2014. Durante su reinado, apoyó e impulsó el proceso hacia la democracia y el país se integró en la Unión Europea.","El 19 junio del año 2014, fue proclamado rey su hijo, Felipe VI.","Representación de España en organismos internacionales","España se unió a la Comunidad Económica Europea (hoy Unión Europea) el 1 de enero de 1986. Desde entonces, España ha desarrollado siempre un papel activo en la construcción del proyecto europeo. España ha desempeñado cinco veces la Presidencia de turno semestral del Consejo de la Unión Europea: en 1989, 1995, 2002, 2010 y 2023).","La bandera de la Unión Europea es azul con 12 estrellas amarillas en círculo.","España también forma parte de otras organizaciones internacionales, como la Organización de las Naciones Unidas (ONU); el Consejo de Europa (CE); la Organización del Tratado del Atlántico Norte (OTAN); al Fondo Monetario Internacional (FMI) y al Banco Mundial.","Un lugar especial en las relaciones internacionales de España lo ocupa la Comunidad Iberoamericana de Naciones, que está formada por los 19 países de América Latina que hablan español y portugués, y los 3 de la península ibérica (España, Portugal y Andorra).","El organismo internacional de apoyo a estos 22 países es la Poder Ejecutivo Secretaría General Iberoamericana.","En la Constitución se establece la separación de los poderes ejecutivo, legislativo y judicial, lo que garantiza el funcionamiento de las instituciones españolas.","Poder Ejecutivo El Gobierno dirige la política interior y exterior de España, la Administración civil y militar, y la defensa del Estado. Es el órgano superior del poder ejecutivo. Poder Legislativo El Gobierno tiene su sede en Madrid, y está formado por el presidente, uno o varios vicepresidentes y los ministros. El presidente del Gobierno tiene su residencia oficial en el Pala cio de la Moncloa. Los miembros del Gobierno juran o prome ten su cargo ante un ejemplar de la Constitución española en presencia del rey.","Poder Legislativo Las Cortes Generales (nombre oficial del Parlamento español) representan al pueblo español y están formadas por dos cámaras: el Congreso de los Diputados y el Senado. Las funciones principales de las Cortes Generales son elaborar, debatir y aprobar las leyes y los Presupuestos generales del Estado y controlar la acción del Gobierno.","El presidente del Congreso de los Diputados es la tercera autoridad del Estado español.","El Congreso de los Diputados está compuesto por 350 diputados, que se eligen por provincias. El Senado, puede variar en el número de miembros que lo componen; en la actualidad hay 265 senadores. La mayoría de los senadores son elegidos por los ciudadanos en las elecciones generales. El resto Poder Judicial son elegidos por las comunidades autónomas.","En el Congreso de los Diputados también tiene lugar la investidura del presidente del Gobierno, a propuesta del rey, y es el sitio en el que se debaten las cuestiones de confianza o las mociones de censura al presidente. Por su parte, el Senado es la cámara de representación territorial de España.","Hay distintos tipos de leyes:","• Ley orgánica. La Constitución exige regular así temas como los derechos fundamentales o los estatutos de autonomía.","• Decreto ley. Ley dictada por el Gobierno en casos de especial urgencia.","• Ley ordinaria. Una forma de ley común que se aprueba en las Cortes por mayoría simple y regula todas las materias que no exigen el carácter reforzado de la ley orgánica.","Antes de que se apruebe una ley, y según quién la propone, hablamos de proyecto de ley (cuando la propone el Gobierno) o una proposición de ley (la propone el Congreso, el Senado, una comunidad autónoma o un mínimo de 500 000 ciudadanos).","Las leyes, una vez aprobadas, necesitan desarrollarse con reglamentos u órdenes ministeriales, a través de normas del Gobierno o los ministerios competentes.","Poder Judicial Está compuesto por jueces y magistrados y tiene la función de administrar la justicia. La base de la organización de los tribunales es el principio de unidad jurisdiccional, ya que todos los jueces y tribunales forman parte de un mismo poder judicial.","El Consejo General del Poder Judicial (CGPJ) es el órgano de gobierno de los jueces. Es un órgano autónomo y sirve para garantizar la independencia de los jueces y tribunales.","El Tribunal Constitucional interpreta la Constitución española. Es independiente de los poderes del Estado.","Religión La Constitución garantiza la libertad religiosa de los individuos y las comunidades, y en este sentido, el Estado español es aconfesional. No reconoce ninguna religión como oficial, aunque hay una fuerte tradición católica.","Las Fuerzas Armadas y las Fuerzas y Cuerpos de Seguridad Las Fuerzas Armadas tienen como misión garantizar la autoridad y la independencia de España, defender su integridad territorial, además del orden constitucional. Su máxima autoridad es el rey, aunque la dirección corresponde al Ministerio de Defensa. Están compuestas por el Ejército de Tierra, el Ejército del Aire y la Armada.","Las Fuerzas Armadas, entre otras acciones internacionales, participan en misiones de paz de la ONU desde 1989.","Las Fuerzas y Cuerpos de Seguridad tienen como función","proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana.","• De ámbito nacional: Fuerzas y Cuerpos de Seguridad del Estado como Cuerpo Nacional de Policía y Guardia Civil. El mando superior corresponde al ministro del Interior. Cada uno de ellos tiene su área de actuación concreta. Entre las funciones de la Policía Nacional está la expedición del documento nacional de identidad y del pasaporte, cuestiones de extranjería como expedición de documentos, tramitación de autorizaciones, permisos de residencia y trabajo. También controla la entrada y salida del territorio nacional de españoles y extranjeros.","Por su parte, la Guardia Civil tiene como funciones, entre otras, vigilar el tráfico en las vías públicas interurbanas, así como en puertos, aeropuertos, fronteras y costas.","• De ámbito autonómico: Ertzaintza en el País Vasco, Mossos d’Esquadra en Cataluña, Policía Foral de Navarra, Cuerpo General de la Policía de Canarias.","• De ámbito local: Policía local. Entre las funciones de la Policía local están la protección de las instituciones y autoridades locales, la regulación del tráfico en pueblos y ciudades y la prestación de auxilio en caso de accidente.","Organismos españoles Son órganos consultivos del Gobierno el Consejo de Estado y el Consejo Económico y Social.","Algunos ejemplos de organismos que pertenecen a ministerios de España son la Agencia Española de Meteorología (AEMET), la Agencia Tributaria (AEAT), la Dirección General de Tráfico (DGT), el Instituto de Comercio Exterior de España (ICEX), el Banco de España, el Instituto Cervantes, el Instituto de las Mujeres, el Instituto Nacional de Estadística (INE), Patrimonio Nacional, Turespaña, etc.","El Defensor del Pueblo garantiza el respeto de los derechos fundamentales y se hace eco de las quejas de los ciudadanos por el mal funcionamiento de las administraciones. Es elegido por el Congreso de los Diputados y el Senado. Su mandato es de cinco años, y no recibe órdenes ni instrucciones de ninguna autoridad. Cualquier ciudadano puede presentar una queja al Defensor del Pueblo y solicitar su intervención,","que es gratuita, para que investigue cualquier actuación presuntamente irregular de la Administración pública española o sus agentes.","El Tribunal de Cuentas controla las finanzas y presupuesto de las administraciones, así como la contabilidad de los partidos políticos.","El Defensor del Pueblo y el Tribunal de Cuentas dependen de las Cortes Generales.","La Agencia Tributaria, que depende del Ministerio de Hacienda y Función Pública, es la encargada de la recaudación de impuestos que contribuyen al sostenimiento de los gastos públicos. También se encarga de la aplicación del sistema tributario en general.","Organización territorial y administrativa En la Constitución de 1978 se establece que España se organiza a partir de ese momento en comunidades autónomas, provincias y municipios. Se distinguen tres niveles de organización de la Administración: central (del Estado), autonómica (de las comunidades autónomas) y local (en este nivel se incluyen las provincias y los municipios).","En cada uno de los niveles las entidades de gobierno tienen autonomía para la gestión de sus respectivos intereses, de acuerdo con la ley.","El Estado posee competencias exclusivas sobre materias como nacionalidad, extranjería, inmigración, relaciones internacionales y administración de justicia.","Comunidades y ciudades autónomas Son 17 las comunidades y 2 las ciudades autónomas de España. La base para su formación fueron las características históricas, culturales y económicas comunes de provincias que tiene fronteras compartidas. La ley institucional básica de cada comunidad es el Estatuto de Autonomía, en el que se establece:","• El nombre de la comunidad que corresponde a su identidad histórica.","• La delimitación de su territorio.","• El nombre, organización y sede de las instituciones autónomas propias.","• Las competencias asumidas dentro del marco establecido","en la Constitución y las bases para el traspaso de los servicios correspondientes a la comunidad. Entre las más significativas se encuentran la sanidad y la educación. Las instituciones de las comunidades autónomas son: la asamblea legislativa (o parlamento autonómico), elegida por votación popular entre todos sus habitantes en las elecciones autonómicas; el consejo de gobierno, con funciones ejecutivas; y el presidente, que además de su función ejecutiva, representa a la comunidad autónoma.","El representante del Estado en una comunidad autónoma es el delegado del Gobierno, que coordina y supervisa la acción de la Administración del Estado en el territorio autonómico, coopera con el presidente y el gobierno autonómico, y coordina la actuación de medios estatales en catástrofes o situaciones de emergencia.","Provincias Existen 50 provincias en España, a las que hay que sumar las ciudades autónomas de Ceuta y Melilla. El órgano de gobierno","Hay comunidades autónomas con Hay comunidades autónomas de una varias provincias como Galicia, Cataluña, sola provincia como Madrid, Murcia, Extremadura, Valencia, etc. La Rioja, etc."]},{"h":"de Madrid","paras":["de la provincia es la Diputación, excepto en Canarias e Islas Baleares. En Canarias los órganos de gobierno son los cabildos y en Baleares son los consejos insulares. Las comunidades autónomas uniprovinciales no tienen diputación.","Municipios Existen 8132 municipios en España. El órgano de gobierno es el ayuntamiento, formado por el alcalde y los concejales, que se encargan de gestionar los servicios públicos de la ciudad o del pueblo y que son elegidos por los habitantes de la localidad en las elecciones municipales.","Entre las competencias de los ayuntamientos se encuentran la protección de su patrimonio histórico, medio ambiente, urbanismo, suministro de agua e iluminación, actividades e instalaciones culturales y deportivas, etc.","El Gobierno y las comunidades autónomas cuentan con diversos medios para comunicarse con los ciudadanos, entre ellos, el Boletín Oficial del Estado (BOE) y los diferentes boletines de las comunidades autónomas, que informan de las leyes, decretos, nombramientos, etc.","Por otro lado, las distintas administraciones tienen sistemas de atención presencial, telefónica y electrónica, como el teléfono 060 (teléfono de información de la Administración General del Estado) y el Portal de la Administración Electrónica (PAe).","La Administración Electrónica El Portal de la Administración Electrónica (PAe) es una página web oficial del Gobierno de España que reúne información, servicios y recursos relacionados con la transformación digital de la Administración Pública.","En España, muchos trámites con la Administración Pública (como pedir un certificado, pagar tasas, inscribirse en el padrón, solicitar ayudas, etc.) se pueden hacer por Internet sin necesidad de acudir físicamente a una oficina de la Administración. Este servicio evita desplazamientos y facilita las gestiones.","Cada ministerio u organismo público tiene su propia sede electrónica, es decir, su web oficial, desde donde pueden realizarse trámites: presentar documentos, pagar impuestos, consultar expedientes, etc.","Para realizar trámites en sede electrónica es necesario disponer de una identidad digital. Los ciudadanos usan sistemas de","identificación segura como el DNI electrónico, el certificado digital o la plataforma Cl@ve. Todos ellos sirven como firma electrónica que tiene el mismo valor que una firma en papel, pero válida para internet. Las firmas electrónicas dan seguridad jurídica.","Los trámites en línea están disponibles en cualquier momento, no solo en horario de oficina, por lo que el ciudadano no necesita desplazarse ni hacer colas. Además, el ciudadano puede consultar en línea cómo va su expediente en cualquier momento.","Población España es el cuarto país más poblado de la Unión Europea (por detrás de Alemania, Francia e Italia), con una población en 2025 de más de 49 millones de habitantes. Por otro lado, es el segundo país más extenso de la UE, con una superficie de 505 944 km² y una densidad de población de 96 habitantes por km².","Las diez ciudades de España con mayor población son, por este orden: Madrid, Barcelona, Valencia, Sevilla, Zaragoza, Málaga, Murcia, Palma de Mallorca, Las Palmas de Gran Canaria y Alicante.","La distribución de la población española por comunidades autónomas es la que podemos visualizar en la Tabla 2.","Participación ciudadana La Constitución establece que la base del sistema político es el derecho al voto de todos los españoles mediante","TABLA 2. Número de habitantes por comunidades autónomas","sufragio universal, libre, igual, directo y secreto, en el que son electores y elegibles todos los españoles mayores de 18 años. En las elecciones municipales también se permite el voto de los ciudadanos residentes en España procedentes de la Unión Europea y de algunos países con los que España tiene firmados acuerdos.","La Constitución señala que las elecciones las convoca el rey. En España se convocan cada cuatro años y pueden ser: generales, para elegir a los diputados y senadores del Congreso y del Senado, respectivamente; autonómicas, para elegir a los miembros de las asambleas y parlamentos autonómicos; y municipales, para elegir a los concejales de los ayuntamientos. Además, cada cinco años se celebran (como en el resto de la UE) las elecciones europeas, en las que se elige a los eurodiputados españoles en el Parlamento Europeo.","España tiene un sistema pluripartidista, es decir, los ciudadanos pueden elegir entre diversas opciones políticas o partidos, tanto en el ámbito nacional como en el autonómico o en el local. Todos los españoles mayores de edad pueden ejercer su derecho al voto en las elecciones.","Desde que se aprobó la Constitución española en 1978 hasta 2023, ha habido 7 presidentes de Gobierno, pertene cientes a 3 partidos, como se observa en la Tabla 3.","El artículo 22 de la Constitución española reconoce el derecho de asociación, en el que define los principios comunes a todas las asociaciones como, por ejemplo, que tienen que inscribirse en un registro.","La Constitución incluye también referencias a asociaciones como los partidos políticos (artículo 6), los sindicatos —organizaciones que defienden y promueven los intereses de los trabajadores— (artículos 7 y 28), las asociaciones de consumidores y usuarios (artículo 51) y las organizaciones profesionales (artículo 52).","Los sindicatos en España tienen gran importancia. Los más representativos participan tanto en negociaciones con empresarios y gobiernos como en el órgano consultivo económico del Gobierno, el Consejo Económico y Social. Los sindicatos en España tienen gran importancia. Los más representativos participan tanto en negociaciones con empresarios y gobiernos, como en el órgano consultivo económico del Gobierno, el Consejo Económico y Social.","TABLA 3. Relación de presidentes de Gobierno y sus partidos políticos entre 1979 y 2024"]}]},{"t":2,"title":"Derechos y deberes fundamentales","sections":[{"h":"Introducción","paras":["En la Constitución de 1978 se recogen los derechos fundamentales, deberes y libertades de los españoles, dentro y fuera de España, y de los residentes extranjeros.","Algunos de los derechos, deberes y libertades más importantes establecidos en la Constitución española de 1978 son los siguientes:","Artículo 6 Los partidos políticos expresan el pluralismo político de acuerdo con la voluntad popular y son instrumento para la participación política. Su creación es libre dentro del respeto a la Constitución y a la ley.","Su estructura y funcionamiento deberán ser democráticos.","Artículo 10 Las normas relativas a los derechos fundamentales y a las libertades —que reconoce la Constitución— se deben interpretar de conformidad con la Declaración Universal de los Derechos Humanos y los tratados y acuerdos internacionales firmados por España.","Artículo 12 Los españoles son mayores de edad a los 18 años.","Artículo 14 Los españoles son iguales ante la ley y no podrá existir discriminación por su nacimiento, raza, sexo, religión o cualquier otra condición o circunstancia personal o social.","Artículo 15 Todos tienen derecho a la vida y a la integridad física y moral. Se elimina la pena de muerte y se prohíbe la tortura.","Artículo 16 1. Se garantiza la libertad ideológica y religiosa de los individuos y las comunidades. 2. Nadie puede ser obligado a decir cuáles son sus ideas políticas o religiosas. 3. No hay ninguna religión oficial en España, por eso España es un Estado aconfesional.","Artículo 18 1. Se garantiza el derecho al honor y a que se respeten la vida familiar y personal. 2. El domicilio es inviolable. Nadie puede entrar sin permiso del titular. La policía solo podrá entrar con una autorización judicial o cuando se esté cometiendo un delito. 3. Se garantiza el secreto de las comunicaciones y, en especial, de las postales, telegráficas y telefónicas, excepto si hay resolución judicial. 4. La ley limita el uso de la informática para garantizar el honor y la intimidad. También se limita el acceso de terceras personas a datos de carácter personal","Artículo 19 Los españoles tienen el derecho a elegir libremente dónde quieren vivir. Pueden desplazarse libremente por todo el territorio español y entrar y salir sin que pueda limitarse este derecho por motivos políticos o ideológicos.","Artículo 20 1. Se reconocen y protegen los derechos: a. A expresar y difundir libremente los pensamientos, ideas y opiniones por cualquier medio escrito u oral. b. A la producción y creación literaria, artística, científica y técnica. c. A que los profesores puedan impartir sus enseñanzas con libertad. d. A comunicar o recibir libremente información verdadera por cualquier medio de difusión (libertad de prensa).","2. Todas estas libertades no tendrán ningún tipo de censura, su único límite es el respeto a los derechos reconocidos a los españoles y, especialmente, el derecho al honor, a la intimidad, a la propia imagen y a la protección de la juventud y de la infancia.","Artículo 22 1. Se reconoce el derecho de asociación. 2. Están prohibidas las asociaciones con fines ilegales.","Artículo 23 Los ciudadanos tienen derecho a participar en los asuntos políticos, pudiéndose presentar ellos mismos a las elecciones o eligiendo a sus representantes.","Tienen derecho al voto todos los españoles mayores de 18 años y a quienes no se les haya quitado este derecho por sentencia judicial.","Artículo 25 1. Una persona solo puede ser condenada por acciones u omisiones que en el momento de producirse sean delito. Explicación: el término «omisiones» se refiere a aquello que se ha dejado de decir o realizar, ya sea de manera involuntaria o intencional. Es una obligación que no se cumple. 2. Las penas de cárcel están orientadas a la reeducación y reinserción social.","Artículo 27 1. Todos tienen el derecho a la educación. Se reconoce la libertad de enseñanza. 4. La enseñanza básica es obligatoria y gratuita. Consta de dos etapas: Educación Primaria (de 6 a 12 años) y Educación Secundaria Obligatoria (de 12 a 16 años).","Artículo 28 1. Los ciudadanos tienen derecho a pertenecer a cualquier sindicato. 2. Se reconoce el derecho a la huelga de los trabajadores para defender sus intereses y se prevé el mantenimiento de los servicios mínimos a la comunidad mientras esta dure.","Artículo 30 1. Los españoles tienen el derecho y el deber de defender a España. 4. Los ciudadanos deben ayudar en los casos de grave riesgo, catástrofe o calamidad pública.","Artículo 31 1. Todos los ciudadanos deben pagar unos impuestos para contribuir a sostener los gastos públicos de acuerdo a su capacidad económica.","2. El gasto público administrará equitativamente los recursos públicos, es decir: de manera justa para todos.","Artículo 32 1. La ley regulará las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges, las causas de separación y divorcio y sus efectos. 2. La edad mínima para contraer matrimonio es de 16 años.","Artículo 37 La ley garantizará el derecho a la negociación colectiva laboral entre los representantes de los trabajadores y empresarios, así como que se cumplan los convenios.","Artículo 41 Todos los ciudadanos tendrán acceso a un sistema de Seguridad Social público, que les garantizará atención en situaciones de necesidad, especialmente para los que no tienen trabajo.","Artículo 43 Los poderes públicos deben proteger la salud y promover la educación sanitaria, la educación física y el deporte.","Artículo 45 Todos tienen derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como el deber de conservarlo.","Artículo 47 Todos los españoles tienen derecho a disfrutar de una vivienda digna y adecuada.","Artículo 48 Los jóvenes tienen el derecho de participar libremente en el desarrollo político, social, económico y cultural del país.","Artículo 51 Los poderes públicos garantizarán la defensa y protección de los consumidores y usuarios, así como la seguridad, la salud y sus intereses económicos.","Artículo 54 El defensor del pueblo es designado por las Cortes Generales para la defensa de los derechos y libertades públicas de los ciudadanos. Tiene funciones de Alto Comisionado de las Cortes Generales y puede supervisar la actividad de la admi-","nistración pública. [Los ciudadanos pueden dirigirse a él para denunciar casos de malas prácticas].","[Los españoles, como miembros de la Unión Europea, también pueden dirigirse o plantear reclamaciones a las instituciones y organismos europeos, como el Tribunal de Justicia de la UE de Luxemburgo, o el Centro Europeo del Consumidor].","Artículo 117 La justicia surge del pueblo y la administran jueces y magistrados de forma independiente y responsable.","Artículo 118 Hay que cumplir las sentencias de los jueces y tribunales, así como colaborar con ellos cuando se lo pidan.","Artículo 119 La justicia será gratuita cuando así lo diga la ley y, en todo caso, para aquellos sin recursos económicos."]}]},{"t":3,"title":"Organización territorial de España. Geografía física y política","sections":[{"h":"GEOGRAFÍA FÍSICA Y POLÍTICA","paras":["España está situada en el sur de Europa y tiene frontera con Andorra, Francia, Portugal y Marruecos. Es el cuarto país más grande del continente, con una extensión de 505 944 km . Es uno de los países más montañosos de Europa, con una altitud media de 650 metros sobre el nivel del mar. La cifra oficial de habitantes es de 49 315 949 a 1 de julio de 2025.","España está compuesta por:","• la mayor parte de la península ibérica (excepto Portugal y Andorra);","• las islas Baleares, en el mar Mediterráneo;","• las islas Canarias, en el océano Atlántico;","• las ciudades de Ceuta y Melilla, situadas en la costa norte de África.","Accidentes geográficos más importantes de España","Ríos: los ríos más importantes de España que desembocan en el océano Atlántico son: Miño, Duero, Tajo, Guadiana y Guadalquivir. En el mar Mediterráneo desembocan los ríos Ebro, Júcar, Segura y Turia.","Meseta: es una extensa llanura situada en el centro de la península ibérica, con una altura media de más de 600 m sobre el nivel del mar, dividida por una cordillera que la atraviesa de lado a lado y que es el Sistema Central.","Montañas: las principales montañas de la península ibérica, de norte a sur, son los Pirineos, donde se sitúa el tercer monte más alto de España, el Aneto; el Sistema Central y los","Sistemas Bético y Penibético, donde se localiza el segundo pico más alto de España, el Mulhacén, en Sierra Nevada. La montaña más alta de España es un volcán situado en la isla de Tenerife, el Teide.","España fue uno de los primeros países de Europa en comenzar a proteger la naturaleza; la primera Ley de Parques Nacionales se aprobó en 1916. Tiene 16 parques nacionales; su gestión y protección se hace a través de la Red de Parques Nacionales.","Los parques nacionales de España son, en la actualidad: Islas Atlánticas de Galicia, Picos de Europa (Asturias, Castilla y León y Cantabria), Ordesa y Monte Perdido (Aragón), Aigüestortes y Estany de Sant Maurici (Cataluña), Monfragüe (Extremadura), Sierra de Guadarrama (Madrid), Cabañeros y Tablas de Daimiel (Castilla-La Mancha), Doñana, Sierra Nevada y Sierra de la Nieves (Andalucía), Archipiélago de Cabrera (Islas Baleares) y Caldera de Taburiente, Teide, Timanfaya y Garajonay (Canarias).","El clima España tiene más de 3000 horas de sol al año, por lo que es uno de los países más cálidos de Europa. Debido a su situación geográfica, España se caracteriza por su variedad de climas:","Clima oceánico: es el de las comunidades del norte de España que están junto al mar Cantábrico y al océano Atlántico. Tiene temperaturas suaves todo el año. Llueve mucho.","Clima mediterráneo: es el de los territorios situados cerca del mar Mediterráneo. Tiene temperaturas suaves en invierno y calurosas en verano. Llueve poco, aunque a veces de forma intensa.","Clima continental: es el de las comunidades del centro de la península ibérica. Las temperaturas son extremas con inviernos fríos, veranos muy calurosos, lluvias moderadas y, a veces, nieva.","Clima subtropical: es el de las islas Canarias. Tiene temperaturas suaves todo el año, con una media de 22 ºC. Llueve poco, aunque a veces de manera intensa.","División territorial de España En el mapa político de España, se puede observar la división de España en comunidades autónomas, divididas en provincias, y ciudades autónomas.","TABLA 4 Comunidades autónomas, provincias, capitales de provincia y capitales de comunidades autónomas","España posee una larga tradición literaria. Muchos de sus autores y obras son reconocidos internacionalmente.","Los dos grandes momentos históricos más representativos de la literatura española se pueden situar en el Siglo de Oro (siglos XVI y XVII) y en la llamada Edad de Plata (primera mitad del siglo XX).","Uno de los escritores más reconocidos es Miguel de Cervantes Saavedra (1547-1616), nacido en Alcalá de Henares (Madrid). Su obra, El ingenioso hidalgo don Quijote de La Mancha, es considerada la primera novela moderna y sus personajes principales, don Quijote y Sancho Panza, son conocidos en todo el mundo.","Otra obra famosa es el Cantar de Mio Cid, escrita en el siglo XIII. El Cid Campeador fue Rodrigo Díaz de Vivar (c. 1043– 1099), un caballero castellano de la época de la Reconquista en la península ibérica.","Un personaje popular de la tradición literaria española, mito literario universal, es don Juan, que aparece por primera vez en la obra de Tirso de Molina El burlador de Sevilla y convidado de piedra, en 1630.","Durante el Siglo de Oro, la literatura alcanzó un gran desarrollo en todos los géneros. En el teatro, destacaron autores como Lope de Vega, creador de la comedia nueva y autor de Fuenteovejuna, y Calderón de la Barca, cuya obra maestra es La vida es sueño. En la narrativa, surgió la novela picaresca en la que resalta el Lazarillo de Tormes, que muestra la vida"]}]},{"t":4,"title":"Cultura e historia de España","sections":[{"h":"Introducción","paras":["difícil de un niño pobre y critica la sociedad de su tiempo. En el ámbito de la literatura religiosa y mística, destacan Santa Teresa de Jesús, con Camino de perfección, y San Juan de la Cruz, con sus poemas de profunda espiritualidad. En la poesía, encontramos a figuras como Garcilaso de la Vega, introductor de los modelos italianos; Luis de Góngora, con su estilo culterano; y Francisco de Quevedo, maestro de la sátira y el conceptismo.","Ya en el siglo XX, la literatura española vivió otro gran momento: la Edad de Plata, que se extiende aproximadamente desde finales del siglo XIX hasta la Guerra Civil (1936). En la Generación del 98, autores como Antonio Machado, Valle-Inclán y Miguel de Unamuno compartieron una preocupación por la realidad de España y su futuro. La Generación de 1914 con autores como José Ortega y Gasset, con su filosofía, y Clara Campoamor, defensora de los derechos de la mujer, representó una forma de entender la realidad más europea. La Generación del 27 supuso un auge lírico y teatral, con Federico García Lorca como figura central, autor de La casa de Bernarda Alba, acompañado de poetas y pensadores como Rafael Alberti, M.ª Teresa León, María Zambrano, Miguel Hernández, Rosa Chacel y Vicente Aleixandre (premio Nobel de Literatura). Tras la Guerra Civil, en la etapa de la posguerra, destacaron novelistas como Camilo José Cela, con La colmena; Carmen Laforet, con Nada; Ana María Matute, con Los hijos muertos; y Miguel Delibes, con El camino.","Además, no puede olvidarse la riqueza de las otras lenguas de España, donde también surgieron obras de gran valor universal: en gallego, Rosalía de Castro con Follas Novas; en euskera, Bernardo Atxaga con Obabakoak; y en catalán, Mercè Rodoreda con La plaça del Diamant.","La literatura española de finales del siglo XX y principios del XXI es plural y diversa. Por un lado, conecta con el pasado —la Guerra Civil, la dictadura, la memoria histórica—; y por otro, abre caminos hacia temas universales y contemporáneos: la globalización, el papel de la mujer, la vida urbana, la precariedad.","En este período, han destacado figuras como Miguel Delibes que representó la mirada cercana al campo, la naturaleza y la vida sencilla, como en Los santos inocentes. En el cambio de siglo siguió siendo una referencia moral y literaria, muy querido por sus lectores.","Con Eduardo Mendoza, la narrativa española incorporó más humor, sátira y crítica social. Novelas como La verdad sobre el caso Savolta o Riña de gatos muestran cómo la literatura podía ser entretenida y a la vez profunda.","Entre las escritoras, Soledad Puértolas, miembro de la Real Academia Española, aportó una voz intimista y reflexiva, centrada en las emociones y las relaciones humanas. Sus obras reflejan la vida cotidiana y los cambios en la sociedad española.","En los años 90 y 2000 apareció una generación que conquistó al gran público internacional. Entre ellos destaca Antonio Muñoz Molina, uno de los grandes narradores españoles contemporáneos, con una obra muy variada y de enorme prestigio dentro y fuera de España. Entre sus obras más conocidas destacan El invierno en Lisboa o No te veré morir. Otro escritor de esta época de fama internacional es Javier Marías, con novelas como Corazón tan blanco o Berta Isla. Otro ejemplo es Carlos Ruiz Zafón con La sombra del viento, un fenómeno editorial que llevó la literatura española a millones de lectores en todo el mundo.","También María Dueñas tuvo un gran éxito con El tiempo entre costuras, una novela histórica protagonizada por una mujer fuerte, ambientada en la Guerra Civil y en Marruecos.","La memoria histórica se convirtió en un tema central. Almudena Grandes escribió la serie Episodios de una guerra interminable, donde recupera historias silenciadas de la posguerra. En la misma línea, Javier Cercas, con Soldados de Salamina, reflexiona sobre la Guerra Civil y el recuerdo colectivo.","Otro autor que se volvió fundamental es Fernando Aramburu. Su novela Patria (2016) aborda el terrorismo de ETA y sus efectos en la sociedad vasca, mostrando cómo la violencia marcó la vida de muchas familias.","En el ensayo narrativo, Irene Vallejo sorprendió con El infinito en un junco, donde cuenta la historia del libro y de la lectura, convirtiéndose en un fenómeno cultural.","Sara Mesa es una escritora española contemporánea conocida por su estilo sobrio y directo. Sus novelas exploran las relaciones humanas, el deseo y el poder, con atmósferas tensas y pocos adornos. Su libro más conocido es Un amor, una","historia corta e intensa sobre una mujer que intenta empezar de cero en un pueblo y se enfrenta a límites y abusos.","La música española tiene una larga tradición. Entre sus representantes más destacados podemos citar:","• Compositores: Manuel de Falla con El amor brujo. Joaquín Rodrigo compuso el Concierto de Aranjuez.","• Cantantes líricos: Montserrat Caballé y Ainhoa Arteta, sopranos; Alfredo Kraus y Josep Carreras, tenores españoles de fama internacional.","• Con la llegada de la Transición, la movida madrileña abrió la puerta a la experimentación y a la modernidad urbana. Artistas como Joaquín Sabina encarnaban la mezcla de crónica social, ironía y bohemia, consolidando un movimiento musical que estaba entre la memoria de la tradición y la búsqueda de libertad creativa.","• Canción moderna: Joan Manuel Serrat y Alejandro Sanz, cantautores; Rosalía, Luz Casal y Enrique Iglesias, son cantantes con gran proyección en EE. UU. e Hispanoamérica.","• Flamenco: Lola Flores la faraona, cantaora; Camarón de la Isla, cantaor; Paco de Lucía, compositor y guitarrista; Carmen Amaya o Sara Baras, bailaoras, son fundamentales en la historia del flamenco.","En la historia del cine español, resulta imprescindible mencionar a Luis Buñuel, considerado uno de los directores más importantes e influyentes del cine mundial, especialmente por su relación con el surrealismo y su capacidad de provocar reflexiones sociales y políticas a través de la imagen. Sin embargo, el cine español no se limita a su figura: a lo largo de las décadas han surgido otros grandes cineastas que han marcado etapas y estilos muy distintos.","El director Carlos Saura exploró la memoria histórica y la identidad cultural, mientras que José Luis Garci llevó al cine español su primer Óscar con Volver a empezar (1983). Pilar Miró destacó tanto por su mirada crítica como por su papel en la modernización del cine nacional. La sátira social de Luis García Berlanga es ya un clásico, y Fernando Trueba aportó un cine cosmopolita y lleno de sensibilidad.","En tiempos más recientes, figuras como Pedro Almodóvar, con su universo colorido y transgresor, o Alejandro Amenábar, con sus películas de gran proyección internacional, han consolidado al cine español en el panorama mundial. También han ganado prestigio Fernando León de Aranoa, con su mirada social y humana, y directores como J. A. Bayona o Jaume Collet-Serra, que han dado el salto a la industria de Hollywood sin perder su sello personal.","Junto a ellos, en los últimos años las directoras han adquirido un peso cada vez mayor, aportando miradas diversas y renovadoras. Isabel Coixet se ha consolidado como una de las voces más singulares del panorama europeo, mientras que Carla Simón, con obras como Verano 1993 o Alcarràs, ha situado al cine español en lo más alto de los festivales internacionales. También destacan figuras como Icíar Bollaín, que ha sabido combinar compromiso social y sensibilidad artística en películas aclamadas dentro y fuera de España, y jóvenes cineastas como Pilar Palomero, premiada por Las niñas, o Alauda Ruiz de Azúa, reconocida por Cinco lobitos.","Actores y actrices de fama internacional son: Javier Bardem, Penélope Cruz (ambos ganadores de un Óscar), Antonio Banderas, Inma Cuesta, Miguel Ángel Silvestre, Javier Cámara, Ana de Armas, Luis Tosar, Maribel Verdú, Carmen Maura, Victoria Abril, Úrsula Corberó, Clara Lago, Karra Elejalde o Eduard Fernández.","España gestiona teatros, auditorios y compañías nacionales artísticas a través de su Ministerio de Cultura:","• Teatro de la Zarzuela, especializado en ópera y danza; Teatro María Guerrero, sede principal del Centro Dramático Nacional; o Teatro de la Comedia, sede de la Compañía Nacional de Teatro Clásico, cuya principal misión es recuperar, preservar, producir y difundir el patrimonio teatral anterior al siglo XX.","• El Ballet Nacional de España, que ofrece diversos estilos de baile;","• La Orquesta y Coro Nacionales, con música sinfónica y coral que promociona la música clásica desde diversas perspectivas."]},{"h":"ARQUITECTURA Y ARTES PLÁSTICAS","paras":["España tiene un rico patrimonio. La UNESCO ha reconocido 49 bienes españoles como Patrimonio de la Humanidad (bienes culturales, naturales y mixtos), lo que sitúa a España como el tercer país con más bienes reconocidos, por detrás de Italia (58) y China (56).","En 1984 España incorporó los primeros cinco bienes a la lista de Patrimonio de la Humanidad:","• La Alhambra y el Generalife (Granada, siglos X-XIV).","• La Catedral de Burgos (siglo XIII).","• La Mezquita de Córdoba (siglos VIII-XIII).","• El Monasterio y Sitio de El Escorial (Madrid, siglo XVI).","• El Parque Güell, el Palacio Güell y la Casa Milà (Barcelona, siglo XX).","Posteriormente, se han sumado la Cueva de Altamira y el arte rupestre prehistórico del norte de España (Asturias, Cantabria y País Vasco); el Acueducto de Segovia y el conjunto arqueológico de Mérida (de época romana); la fachada de la Natividad y la cripta de la Sagrada Familia de Gaudí (Barcelona, siglos XIX-XXI), entre otros.","Otro de los bienes españoles declarado Patrimonio de la Humanidad es el Camino de Santiago, una de las rutas de peregrinación artístico-religiosas europeas más importantes.","Patrimonio Nacional es el organismo público responsable del cuidado y mantenimiento de los bienes artísticos que actualmente pertenecen al Estado español. Es un organismo que pone a disposición de los ciudadanos el patrimonio histórico -artístico con fines culturales, científicos y docentes.","Además de los museos nacionales del Prado y Reina Sofía, hay otros muy conocidos internacionalmente: el Museo Picasso, en Barcelona; el Museo Thyssen-Bornemisza, en Madrid, y el Museo Guggenheim de Bilbao.","Algunas obras, sus pintores y algunos museos españoles de fama internacional son:"]},{"h":"CIENCIA Y TECNOLOGÍA","paras":["En la Edad Media, España vivió un gran momento de esplendor científico gracias a Al-Ándalus. Ciudades como Córdoba se convirtieron en centros de cultura donde se estudiaban medicina, filosofía, matemáticas y astronomía. Pensadores como Averroes y Maimónides tuvieron un papel muy importante porque difundieron y desarrollaron conocimientos que más tarde influyeron en toda Europa.","Este saber no quedó limitado a la Península, ya que en la Escuela de Traductores de Toledo se pasaron al latín y al castellano muchas obras escritas en árabe y griego. Gracias a este trabajo, gran parte de la ciencia del mundo antiguo y del mundo islámico pudo llegar a las universidades europeas, convirtiendo a España en un puente fundamental entre Oriente y Occidente.","Actualmente, el Consejo Superior de Investigaciones Científicas (CSIC), la mayor institución pública dedicada a la inves tigación en España y la cuarta de Europa, tiene como objetivo principal desarrollar y promover investigaciones para conseguir el progreso científico y tecnológico.","En España se han creado numerosos parques tecnológicos y observatorios astronómicos, entre los que destacan la Estación de Seguimiento de Satélites de Villafranca del Castillo, ahora centro de la Agencia Espacial Europea (ESA), el Observatorio del Teide en Tenerife y el Observatorio de Calar Alto en Almería, que trabajan en la investigación astronómica de vanguardia."]},{"h":"ACONTECIMIENTOS RELEVANTES EN LA HISTORIA DE ESPAÑA (1252-2019)","paras":["Algunos de los acontecimientos de la historia de España más conocidos internacionalmente desde el s. XIII hasta la actualidad son:","TABLA 5. Acontecimientos relevantes en la historia de España","TABLA 5. Acontecimientos relevantes en la historia de España"]},{"h":"FIESTAS, CELEBRACIONES Y FOLCLORE","paras":["Cada comunidad autónoma y cada municipio tiene sus fiestas particulares.","Todas las regiones y zonas de España tienen un rico folclore, que es el legado de las culturas de su historia (celta, romana, cristiana, musulmana…) y se refiere a las tradiciones del pueblo, sobre todo, la música y los bailes. En el folclore popular cabe destacar:","• la jota, cante popular y baile típico que está presente en casi toda España;","• el flamenco, especialmente en Andalucía, declarado Patrimonio Cultural Inmaterial de la Humanidad en 2010;","• la sardana (Cataluña);","• la muñeira (Galicia);","• las sevillanas (Andalucía).","Los instrumentos musicales típicos del folclore español son: la guitarra, las castañuelas, la gaita, la dulzaina, el acordeón, el txistu y el tamboril.","Algunas de las fiestas más conocidas internacionalmente, su fecha y sus símbolos son:","TABLA 6. Fiestas españolas más conocidas","TABLA 6. Fiestas españolas más conocidas"]},{"h":"ACONTECIMIENTOS CULTURALES Y DEPORTIVOS","paras":["En España se celebran todos los años acontecimientos culturales de gran importancia, como:","• Los Premios Princesa de Asturias, concedidos anualmente por la Fundación Princesa de Asturias para promover valores científicos, culturales y humanísticos a nivel internacional.","• El Premio Cervantes, equivalente al Premio Nobel de las letras hispanas, premia la obra literaria completa en español de un escritor español o hispanoamericano. Se concedió por primera vez a Jorge Guillén en 1976.","• El Premio Nacional de las Letras Españolas, concedido anualmente por el Ministerio de Cultura para premiar el conjunto de la obra literaria de un escritor español, en cualquiera de las lenguas de España.","• Ferias del Libro: se celebran en toda España en torno al Día del Libro el 23 de abril, fecha en que murieron Cervantes, Shakespeare y el Inca Garcilaso de la Vega. Su objetivo es la difusión y promoción de los libros y la lectura en España. El sector editorial en España es la principal industria cultural.","• Los Premios Goya, concedidos por la Academia de las Artes y las Ciencias Cinematográficas de España, premian a los mejores profesionales de cada una de las especialidades técnicas y creativas del cine.","• Festivales de cine: los más conocidos son los de San Sebastián, Sitges, Málaga y Valladolid.","• Festivales de teatro clásico: normalmente se celebran en verano. Los teatros clásicos más famosos son el Corral de Comedias de Almagro, el Teatro Romano de Mérida y el Teatre Grec de Barcelona.","• Feria Internacional de Arte Contemporáneo (ARCO), se celebra anualmente en Madrid desde 1981.","Hasta la fecha, los españoles que han recibido un Premio Nobel son:","TABLA 7. Españoles galardonados con el premio Nobel"]},{"h":"DEPORTES","paras":["En España tienen mucha importancia los campeonatos de Liga y de Copa del Rey de fútbol y baloncesto, la Vuelta ciclista a España, así como la participación de los deportistas españoles en campeonatos europeos, mundiales o Juegos Olímpicos.","Algunos de los deportistas más destacados internacionalmente son: Rafael Nadal y Carlos Alcaraz (tenis); Pau y Marc Gasol (baloncesto); Carlos Sainz (automovilismo); Marc Márquez (motociclismo); Miguel Induráin (ciclismo); las selecciones nacionales masculinas y femeninas de fútbol y baloncesto; Edurne Pasaban (montañismo); Mireia Belmonte y Gemma Mengual (natación); Carolina Marín (bádminton); Lydia Valentín (halterofilia).","El deporte paralímpico en España empezó a crecer a mediados del siglo XX con competiciones para personas con discapacidad. En los últimos años, el país ha dado apoyo y visibilidad a estos deportistas, logrando buenos resultados en los Juegos Paralímpicos.","En París 2024, varios españoles destacaron: Teresa Perales, leyenda de la natación, sumó otra medalla y tiene 28 en su carrera; en ciclismo, Ricardo Ten ganó un oro en contrarreloj y Sergio Garrote, un oro en la prueba H2; en triatlón, Susana Rodríguez revalidó su título en PTVI y Daniel Molina fue campeón en PTS3.","En España, las personas tienen un nombre, que puede ser simple (Ana) o compuesto (Juan Carlos), y dos apellidos. Generalmente, el primero es el primer apellido del padre y el segundo, el primer apellido de la madre, aunque los padres pueden decidir invertir el orden, de modo que el apellido de la madre sea el primero.","Algunos documentos importantes en España son:","• El documento nacional de identidad (DNI). Es obligatorio para los españoles mayores de 14 años. Tiene un número de identificación, con una letra al final, que sirve también como Número de Identificación Fiscal (NIF).","• El pasaporte. Es el documento oficial español para poder viajar a países que no pertenecen a la Unión Europea o que no forman parte del espacio Schengen.","• El libro de familia. Es el documento que se obtenía al tener (o adoptar) un hijo o al casarse, y en él aparecía la información de los padres y de sus hijos (o solo de la pareja); los trámites se realizaban en el Registro Civil. Desde el 1 de mayo de 2021, convive con el registro electrónico individual, en él se anota el nacimiento, la mayoría de edad, la fecha de matrimonio, o la adquisición de la nacionalidad de una persona.","• El certificado de nacimiento. Es el documento que muestra cuándo y dónde nace alguien y se obtiene en el Registro Civil, organismo que depende del Ministerio de Justicia."]}]},{"t":5,"title":"Sociedad española","sections":[{"h":"Introducción","paras":["• El número de la Seguridad Social. Lo recibe una persona cuando empieza a trabajar y a cotizar en la Seguridad Social. Se obtiene en la Tesorería General de la Seguridad Social.","• El informe de vida laboral. Es un documento que muestra la cotización a la Seguridad Social y toda la trayectoria profesional (las empresas en las que se ha trabajado y las fechas y tipos de los contratos).","• La tarjeta sanitaria. Es la que identifica a una persona para ser atendida en la sanidad pública española. Se tramita en el centro de salud que corresponde al domicilio.","• El carné o permiso de conducir. Sirve para conducir legalmente por España y lo pueden conseguir las personas mayores de 18 años. Para obtenerlo hay que aprobar un examen teórico y uno práctico, presentar un informe de aptitud psicofísica, el DNI o pasaporte en vigor y una fotografía. El organismo responsable de examinar y expedir el documento es la Dirección General de Tráfico (DGT).","• El certificado de empadronamiento. Muestra el lugar de residencia. Para empadronarse, es necesario justificar que se reside en una vivienda y presentar un documento original de identidad (pasaporte, tarjeta de identificación de extranjero (TIE), etc.) en el ayuntamiento del municipio donde se vive.","En los documentos oficiales, aparecen normalmente los siguientes datos: nombre y apellidos; número del DNI (en el caso de los extranjeros, NIE —número de identidad de extranjero— o pasaporte); sexo (hombre-H o mujer-M); domicilio (dirección donde vive una persona, que incluye calle, número de portal, piso y puerta, código postal o CP, localidad y provincia); lugar y fecha de nacimiento.","Los extranjeros que quieran residir en España deben realizar los trámites necesarios para obtener la tarjeta de residencia (TIE).","El tiempo necesario de residencia en España para solicitar la nacionalidad no es igual para todos. Depende del país de origen y la situación personal:","• 10 años: plazo general para la mayoría de extranjeros.","• 5 años: para refugiados.","• 2 años: para nacionales de países iberoamericanos, Andorra, Filipinas, Guinea Ecuatorial, Portugal o personas de origen sefardí.","• 1 año: en casos especiales, por ejemplo: a. Nacido en España. b. Casado con un ciudadano español. c. Viudo de un ciudadano español (si no había separación). d. Haber residido bajo tutela o acogimiento de un ciudadano español.","Los trámites para la obtención de los distintos documentos se realizan en:","• Registro Civil (pertenece al Ministerio de Justicia). Inscripciones de nacimiento, matrimonio, divorcio… También los trámites para obtener la nacionalidad.","• Comisaría de policía (depende del Ministerio del Interior). DNI, TIE y pasaporte. De forma presencial.","• Centro de salud (depende de la Consejería de Sanidad). Tarjeta sanitaria.","En España, los matrimonios pueden ser religiosos o civiles. Se permite el matrimonio entre personas del mismo sexo. Los ciudadanos que no quieren casarse pueden registrarse como pareja de hecho.","En relación con el número de miembros, hay diferentes tipos de familia en España. Las familias monoparentales están formadas solo por el padre o la madre y los hijos. Las familias numerosas son las que tienen tres hijos o más.","En España está permitido el divorcio. En caso de divorcio, está regulada la custodia de los hijos y la responsabilidad económica.","Los poderes públicos deben asegurar la protección social, económica y jurídica de la familia, por lo que se reconocen los siguientes derechos:","• Permisos laborales por nacimiento (o adopción) y cuidado del menor (19 semanas para la madre y 19 para el padre), el permiso de lactancia, o la reducción de la jornada de trabajo por tener a cargo hijos menores de 12 años.","• Ayudas fiscales a las familias: desgravación por hijos en la declaración de la renta y otras ayudas nacionales y autonómicas, como descuentos en transporte público, matrículas universitarias, tarifas de guardería o comedores escolares."]},{"h":"GUÍA DE LA VIDA DIARIA","paras":["Vivienda En España hay diferentes tipos de vivienda, según el lugar (zona urbana o zona rural) y la situación económica de las personas. El tipo de residencia más habitual es el piso en un edificio de viviendas. Otra modalidad es la vivienda unifamiliar, chalé o casa adosada a otras viviendas, con servicios comunes.","En España, alrededor del 75 % de las viviendas son en propiedad (un 30 % de ellas con hipoteca), mientras que cerca del 25 % se alquilan. El alquiler se regula mediante un contrato en el que se fijan datos básicos como la duración, el precio y las obligaciones de arrendador e inquilino, con un mínimo legal de cinco años si el propietario es persona física","(siete si es jurídica). Al firmar, el arrendatario debe entregar una fianza, equivalente, en la mayoría de los casos, a una mensualidad, que el propietario ha de depositar en el organismo autonómico y que sirve para cubrir posibles impagos o desperfectos. Esta fianza se devolverá al finalizar el contrato si no hay incidencias.","También existen viviendas de protección oficial que tienen un precio limitado y generalmente están subvencionadas por la Administración local o autonómica.","En las comunidades de vecinos hay normas básicas de comportamiento social que se deben respetar, por ejemplo: pagar los gastos de la comunidad; no molestar a los demás vecinos con ruidos, sobre todo a partir de las 22:00 horas; reciclar la basura y cuidar los espacios comunes.","Animales domésticos En España muchas personas tienen animales en casa, en su mayoría perros, gatos y pájaros. Los animales se pueden adoptar o comprar, siendo preferible lo primero, ya que en España las protectoras y perreras están llenas de animales abandonados que necesitan un hogar. Estos animales deben registrarse obligatoriamente con un microchip electrónico —sobre todo los perros y los gatos—; vacunarse y llevarse a revisiones veterinarias periódicas, además del seguro de responsabilidad civil por daños a terceros para todos los perros. Se debe velar por su salud y prestarles los cuidados y atenciones necesarias para su correcto desarrollo físico y emocional, así como respetar la convivencia con el resto de ciudadanos, recogiendo sus excrementos de vías públicas y jardines y cumpliendo con las medidas de seguridad obligatorias en la calle (correa, bozal, etc.).","Comidas y bebidas La gastronomía de España es muy rica y variada. Las diversas regiones del país tienen sus propios platos típicos, resultado de la variedad cultural y climática.","España cuenta con grandes cocineros, entre otros, los catalanes Ferran Adrià, Carme Ruscalleda y los hermanos Roca, los vascos Juan Mari Arzak, Pedro Subijana y Martin Berasategui, el asturiano José Andrés, y los madrileños David Muñoz y Paco Roncero.","Algunas de las comidas o bebidas españolas más conocidas internacionalmente son: la paella (arroz con verduras, aza-","frán, pollo, mariscos o carne) la tortilla de patatas o tortilla española (huevos, patata, cebolla), los churros (harina, agua y aceite), el gazpacho (tomate, pepino, pimiento, ajo, cebolla, etc.) o la sangría (vino, frutas, refrescos, etc.). Por otro lado, también son conocidos productos típicos como el aceite de oliva, diversas frutas y verduras, marisco y pescado, productos ibéricos de cerdo (jamón, lomo, chorizo); dulces como turrón, mazapanes, roscón de Reyes y torrijas; bebidas como vino, cava y sidra, etc.","Las regiones más conocidas por sus denominaciones de origen (D. O.) son: La Rioja, Ribera del Duero y Jerez, para los vinos; Principado de Asturias, para la sidra; Cataluña, para los cavas; Andalucía y Castilla-La Mancha, para el aceite de oliva; Extremadura, Andalucía y Castilla y León, para los productos ibéricos.","El aperitivo, que se toma en bares o restaurantes antes de comer, tiene una gran importancia en la gastronomía española. Se llama de forma diferente según tamaño, presentación u origen: tapa, banderilla, pincho, ración…","Los horarios de las comidas en España varían según el día de la semana y las costumbres de cada familia, pero, en general, el desayuno es de 7:30 a 8:30, la comida de 14:00 a 15:30 y la cena de 21:00 a 22:00 h.","En bares y restaurantes, una persona puede elegir una ración; un plato combinado (carne, pescado o huevos, con ensalada y patatas fritas); un menú del día de dos platos entre una selección establecida, con pan, bebida y postre o café; o comer a la carta (el cliente elige cualquier plato de la carta).","Calendario: días festivos y horarios","Calendario escolar: comienza en septiembre y termina en el mes de junio. Cada comunidad autónoma decide las fechas de inicio y finalización de las clases.","Calendario laboral: comienza en enero y termina en diciembre. En él aparecen días festivos nacionales, autonómicos y locales. El total de días festivos es 14.","Las principales fiestas de España son: 1 de enero o Año Nuevo; 6 de enero o Día de Reyes; Viernes Santo; 1 de mayo o Día del Trabajo; 15 de agosto o Asunción de la Virgen; 12 de octubre o Fiesta Nacional de España; 1 de noviembre o Todos los Santos; 6 de diciembre o Día de la Constitución española; 8 de diciembre o la Inmaculada Concepción, y 25 de diciembre o Navidad.","Otras fiestas nacionales que las comunidades autónomas pueden sustituir por fiestas autonómicas son: 19 de marzo o San José; Jueves Santo; 25 de julio o Santiago Apóstol. Además, cada localidad debe determinar dos días adicionales de fiesta oficial.","Los períodos vacacionales más comunes, que coinciden con las vacaciones escolares, son las Navidades (del 24 de diciembre al 6 de enero), la Semana Santa (en torno a finales del mes de marzo o principios de abril) y el verano (entre los meses de julio y agosto).","El horario de España es GMT/UTC + 1 hora en invierno o + 2 horas en verano, excepto en Canarias, que es una hora menos. Los horarios comerciales pueden variar según los establecimientos: la mayoría de las tiendas tiene un horario aproximado de 10:00 a 20:00 horas, con una pausa larga para la comida, de lunes a viernes y el sábado solo abren por la mañana; los domingos suelen estar cerradas.","Educación La educación es un derecho de los ciudadanos; es obligatoria y gratuita (excepto libros y materiales educativos) desde los 6 hasta los 16 años, lo que se llama educación básica.","Las leyes de educación recogen el derecho de los padres, madres y tutores legales a elegir el tipo de educación y el centro para sus hijos. La ley actual es la LOMLOE, conocida como Ley Celáa (2020).","También la ley regula la organización y funcionamiento de los centros educativos y se promueve la colaboración entre la familia y la escuela, para una mayor participación y responsabilidad de los alumnos y de los padres en el funcionamiento de los centros.","TABLA 8. Sistema educativo español","En España hay tres tipos de centros educativos según su financiación:","• Centros públicos: son centros laicos, financiados por la Administración pública. Tienen plazas limitadas y para","acceder a ellos es necesario cumplir una serie de requisitos (por ejemplo, cercanía de la vivienda). En su control y gestión participan los alumnos, padres y profesores del centro.","• Centros concertados: son centros privados, que reciben subvenciones de la Administración pública. La mayoría son religiosos. Tienen libertad de gestión, aunque la Administración establece límite de alumnos por clase, calendario escolar, etc.","• Centros privados: están financiados exclusivamente por los padres de los alumnos. Tienen completa libertad de gestión y cierta libertad de currículum, dentro de los límites de la normativa.","Los tipos de centros educativos que encontramos son:","• Escuelas infantiles: es una etapa educativa de carácter voluntario para niñas y niños de 0 a 6 años. Consta de dos ciclos, el primero comprende hasta los 3 años de edad y el segundo, abarca de los 3 a los 6 años.","• Colegios: que pueden tener educación primaria y secundaria, y en algunos casos también bachillerato.","• Institutos de educación secundaria: centros donde se ofrece toda la enseñanza secundaria obligatoria entre los 12 y los 16 años y el bachillerato (enseñanza secundaria no obligatoria), y programas de educación compensatoria;","• centros de formación profesional: que puede ser básica, de grado medio o superior.","• Centros de educación de personas adultas (CEPA): para proporcionar a las personas mayores de 18 años la posibilidad de completar estudios (obtener el Título de Graduado en Educación Secundaria Obligatoria), actualizar o ampliar su formación; también se imparten cursos de preparación para el acceso a la universidad para mayores de 25 años.","• Universidades: son centros de enseñanza superior en los que se estudian grados, másteres y doctorados.","En España, el sistema educativo ofrece diferentes tipos de becas y ayudas tanto para las distintas etapas
