 y modalidades de enseñanza como para los gastos asociados a la escolarización.","Las becas abarcan desde la educación infantil, primaria y secundaria, hasta el bachillerato, la formación profesional, las enseñanzas artísticas y deportivas, el aprendizaje de idiomas y los estudios universitarios.","Además, existen ayudas específicas para cubrir determinados gastos, como el apoyo educativo al alumnado con necesidades especiales, la adquisición de libros de texto y material escolar, el comedor o el transporte escolar.","Aunque cada convocatoria puede establecer condiciones específicas, en términos generales se suelen tener en cuenta:","• tener un rendimiento académico mínimo;","• que la renta familiar no supere ciertos límites;","• estar matriculado en un centro autorizado y solicitar la ayuda en plazo.","El Ministerio de Educación, Formación Profesional y Deportes ofrece un servicio para solicitar la homologación o la convalidación de los títulos obtenidos en el extranjero.","Otros servicios culturales y educativos relacionados son:","• Las bibliotecas: de acceso gratuito y donde se pueden consultar o sacar en préstamo libros; con videoteca, sala de ordenadores, conexión wifi, lugar de estudio, etc.","• Los museos: ofrecen visitas virtuales o guiadas, talleres, etc.","• Los centros culturales públicos: ofrecen visitas virtuales o guiadas, talleres, etc.","Salud El Sistema Nacional de Salud en España está formado por el conjunto de servicios y prestaciones sanitarias que garantizan los poderes públicos. La gestión sanitaria se reparte entre la Administración General del Estado, a través del Ministerio de Sanidad, y las comunidades autónomas, que tienen transferidas la mayoría de competencias. El Ministerio de Sanidad se encarga de coordinar y proponer la política sanitaria del Gobierno, así como de planificar y asegurar el derecho de la ciudadanía a la protección de la salud.","Los establecimientos sanitarios son:","• Centro de salud: para una atención primaria³ de salud donde médicos de familia, pediatras, enfermeros prestan su servicio.","• Centro de especialidades: donde diferentes profesionales sanitarios atienden a pacientes con determinadas enfermedades o de un determinado grupo de edad.","• Hospital: para el internamiento clínico de un paciente o asistencia especializada, especialmente cirugía.","También existe un servicio de urgencias en los hospitales, así como asistencia médica domiciliaria si el paciente la necesitara.","Para acceder al sistema de salud es necesaria la tarjeta sanitaria. Cada ciudadano tiene asignado un médico (médico de familia) al que hay que pedir cita previa. La tarjeta también es necesaria para acceder a recetas médicas o a médicos especialistas.","Los ciudadanos también pueden solicitar la tarjeta sanitaria europea, para utilizar en otros países de la UE, que tiene una validez de dos años.","Tanto el Ministerio de Sanidad como las comunidades autónomas realizan campañas de formación y de prevención, así como la financiación de algunos medicamentos según la edad.","España sobresale por el alto porcentaje de donaciones de órganos, ya que lleva 30 años consecutivos siendo líder mundial de donaciones. La Organización Nacional de Trasplantes recibió en 2010 el Premio Príncipe de Asturias.","Servicios sociales y programas de ayuda El Ministerio de Derechos Sociales, Consumo y Agenda 2030 y el Ministerio de Inclusión, Seguridad Social y Migraciones se encargan de las cuestiones relacionadas con la integración social, la familia, la protección del menor y la atención a las personas dependientes o con discapacidad. El Ministerio de Igualdad se encarga de luchar contra la","discriminación y la violencia de género.","El Estado ofrece, a través de la Seguridad Social, ayudas como, por ejemplo, el Ingreso Mínimo Vital para prevenir el riesgo de pobreza y exclusión social; pensión por viudedad, por orfandad o por incapacidad laboral permanente. Por su parte, las distintas comunidades autónomas también ofrecen ayudas destinadas a la familia, infancia, juventud o mayores de 65 años: reducción en el precio de los medicamentos recetados en el Sistema Público de Salud, en el precio del transporte público, de los espectáculos y de los museos, etc., así como condiciones especiales en los viajes promovidos por el Instituto de Mayores y Servicios Sociales (IMSERSO).","Hay organizaciones no gubernamentales (ONG), como Cáritas, Cruz Roja o la Asociación Española Contra el Cáncer (AECC), que ofrecen atención social, económica o sanitaria de gran importancia.","La Organización Nacional de Ciegos Españoles (ONCE) trabaja para conseguir la integración de las personas con discapacidad visual y colabora en la atención y defensa de los derechos de las personas con distintos tipos de discapacidad. Fue premiada por su labor internacional con el Premio Príncipe de Asturias de la Concordia en el año 2013.","Las distintas comunidades autónomas y la Administración central son responsables de la protección civil y la atención de emergencias en España, además de los Cuerpos y Fuerzas de Seguridad del Estado.","El número de teléfono 112 es gratuito y ofrece ayuda al ciudadano ante cualquier tipo de emergencia (sanitaria, incendio, salvamento o seguridad ciudadana) en la Unión Europea.","El número de teléfono 016 es un servicio gratuito de atención a víctimas de violencia de género. Está disponible las 24 horas del día, los 365 días del año, y no deja rastro en la factura telefónica. Además, se ofrece atención en 53 idiomas, lo que facilita el acceso a mujeres de diferentes orígenes. El 016 proporciona información sobre recursos y derechos, asesoramiento jurídico en el momento y apoyo inmediato en situaciones de riesgo.","Este servicio también cuenta con canales alternativos:","• WhatsApp: 600 000 016","• Correo electrónico: 016-online@igualdad.gob.es Las llamadas y consultas se atienden de forma confidencial, anónima y sin necesidad de aportar datos personales.","En el portal web de recursos contra la violencia de género (violenciagenero.igualdad.gob.es) se puede consultar información sobre derechos, recursos disponibles, servicios de apoyo y normativa vigente.","El servicio depende del Ministerio de Igualdad y forma parte de la red de recursos públicos destinados a la prevención y atención integral frente a la violencia de género.","Medios de comunicación e información Los medios de comunicación tienen una función social, porque informan y ayudan a crear opinión en la cultura y la política. Con Internet y las redes sociales esta función cambia: ahora la información llega más rápido y más personas pueden participar, aunque también existe el riesgo de no poder distinguir entre información fiable y no fiable.","• Canales públicos. Corporación RTVE (Radio Televisión Española): La 1 (generalista), La 2 (cultural), Clan (infantil), 24 horas (noticias) y Teledeporte (deportes).","• Canales privados: En España los principales grupos de televisión son Atresmedia (Antena 3, LaSexta, Neox, Nova, Mega, Atreseries) y Mediaset España (Telecinco, Cuatro, FDF, Boing, Divinity, Energy, Be Mad). Además, hay canales autonómicos y temáticos, y servicios de televisión por Internet, fibra o cable, como Movistar Plus+, Vodafone TV u Orange TV.","• Cadenas autonómicas de televisión pública: Canal Sur (Andalucía), ETB Euskal Telebista (País Vasco), Telemadrid (Comunidad de Madrid), TV3 Corporació Catalana de Mitjans Audiovisuals (Cataluña), TVG Compañía de Radio Televisión de Galicia, etc.","En la prensa escrita en España se pueden distinguir varios tipos de medios, que hoy en día publican tanto en papel como en formato digital:","• Medios nacionales: ABC, El Mundo, El País, La Razón, La Vanguardia.","• Regionales: El Correo, La Voz de Galicia, El Periódico de","Catalunya, El Diario Vasco.","• Deportivos: As, Marca, Mundo Deportivo.","• Económicos: Cinco Días, Expansión.","La radio tiene una gran presencia en España. La cadena pública es Radio Nacional, y entre las privadas con mayor audiencia están la Cadena Ser, la COPE y Onda Cero.","Unidades de medida El sistema legal de unidades de medida es el Sistema Internacional de Unidades (SI) de la Conferencia General de","TABLA 9. Principales magnitudes de medidas del SI","TABLA 10. Unidades que no pertenecen al SI cuyo uso es aceptado por el Sistema y que están autorizadas","TABLA 11. Expresiones de medidas habituales","Pesas y Medidas (CGPM) existente en la Unión Europea. Horarios comerciales La mayoría de tiendas abre de 10:00 a 14:00 horas y de 17:00 a 20:00 horas de lunes a viernes y el sábado solo abren por la mañana. Muchos hipermercados y centros comerciales abren de 10:00 a 22:00 horas todos los días.","Normativa de comercio El artículo 51 de la Constitución española garantiza la seguridad, la salud y los intereses económicos de los consumidores y usuarios mediante procedimientos eficaces.","En la normativa de los comercios hay medidas relativas al etiquetado (fecha de caducidad de los productos, precio antes y después de las rebajas…), a la información que se","da al consumidor sobre el producto (productos bancarios, seguros, marcas blancas …), a la garantía del producto (tres años para productos nuevos), o las condiciones de cambio, reparación o devolución.","Por una parte, la Agencia Española de Consumo, Seguridad Alimentaria y Nutrición protege a los consumidores y usuarios y, por otra, el Consejo de Consumidores defiende los intereses de los consumidores y usuarios y toma decisiones relacionadas con la política de consumo.","Servicios y espacios públicos Los comercios habituales que ofrecen servicios a los ciudadanos son:","• Farmacias: donde se venden medicinas con o sin receta médica, algunas con ayuda económica de la Administración pública, y tienen un horario mínimo establecido y un servicio de guardia para atender a los ciudadanos durante las 24 horas del día.","• Correos: es el lugar en el que se realizan envíos postales.","• Quiosco: es el lugar en el que se venden periódicos y revistas.","• Mercados municipales: son agrupaciones de pequeños puestos que venden alimentos frescos (fruta, pescado, carne, etc.).","• Supermercados: que ofrecen una variedad de productos de alimentación y limpieza para el hogar.","• Librerías-papelerías: el lugar donde encontrar libros, material escolar y artículos de oficina, a menudo vinculados a la vida cotidiana de estudiantes y trabajadores.","En las ciudades hay zonas de recreo y de descanso, como parques, jardines o instalaciones deportivas. En estos lugares de actividades de ocio al aire libre, hay unas normas:","1. Respetar a las demás personas, a los representantes del orden (público y privado) y el mobiliario urbano.","2. Respetar las normas escritas del establecimiento o vía","pública en la que uno se encuentre. 3. Respetar los horarios de apertura y cierre de las instalaciones. 4. No consumir bebidas, ni alimentos, si no está permitido.","5. No fumar, en el caso de que el lugar público esté frente a un hospital o centro educativo.","6. No pisar el césped, ni arrancar flores.","7. Colaborar con los agentes de seguridad, si fuera necesario.","Es necesario tener cuidado en parques naturales y espacios protegidos para evitar incendios.","Transporte urbano e interurbano en España En España existe una extensa red de carreteras, autopistas de peaje y autovías que recorren todo el país. La red de carreteras puede ser estatal, autonómica o local.","En los últimos años hay menos accidentes mortales en las carreteras gracias al:","• Control de velocidad (kilómetros/hora): el límite en autopista o autovía es de 120 km/h, en carretera convencional es de 90 km/h y dentro de la ciudad es de 20, 30 o 50 km/h;","• Uso de medidas de seguridad en el coche como el uso obligatorio del cinturón de seguridad de todos los ocupantes y la normativa sobre el uso de la silla portabebés;","• Control de alcoholemia (límite de 0,5 g/l en sangre) y de otras sustancias.","Los propietarios de los vehículos deben cumplir una serie de obligaciones, como registrar el coche y matricularlo, tener al día el seguro del coche, hacer las revisiones necesarias (Inspección Técnica de Vehículos, ITV), pagar los impuestos anuales, no dejar conducir el coche a personas sin carné, tener el carné en vigor, respetar las normas de tráfico y no haber perdido todos los puntos del carné (en este caso se retira el permiso de conducir).","Respecto al transporte urbano, España presenta un buen sistema combinado de medios de transporte público (metro, autobús, tranvía, taxi), que se completa con la red de trenes","(de cercanías, y de media y larga distancia). El color de los taxis depende de la ciudad, los precios varían de una zona a otra y se pueden tomar en las paradas de taxis o en circulación si tienen una luz verde encendida o el cartel de «Libre».","Las compañías más importantes de trenes que operan en España son:","• Renfe Operadora: pública, la más grande; gestiona Cercanías, Media y Larga Distancia, AVE y mercancías.","• OUIGO España: privada, ofrece trenes de alta velocidad a precios económicos.","• Iryo: privada, también de alta velocidad, en competencia con Renfe y OUIGO.","• Captrain España: privada, especializada en transporte de mercancías por tren.","Los trenes AVE, ALVIA y ALARIS son los más destacados de la red de alta velocidad.","Las principales normas de comportamiento en los transportes públicos son:","1. Respetar la fila de personas que esperan.","2. Respetar a las demás personas, a los representantes del orden (público y privado) y los bienes del servicio.","3. Respetar las normas sobre equipaje en cada medio.","4. No hablar con el conductor, excepto en caso de emergencia.","5. Dejar salir antes de entrar.","6. No fumar.","7. Ceder el asiento a las personas mayores, con movilidad reducida o embarazadas.","8. No permanecer en los pasillos durante el viaje en autobuses y trenes, o en lugares de paso, ni permanecer en las puertas de acceso del transporte.","9. En un autobús, se recomienda llevar el dinero justo del billete. 10. Cuando las plazas son numeradas, ocupar el asiento asignado en el billete.","En España hay 48 aeropuertos públicos, muchos de ellos internacionales. Las ciudades que destacan por sus redes de transporte son:","• Primeras ciudades con sistema de metro: Madrid, Barcelona, Valencia, Bilbao.","• Aeropuertos más importantes: Madrid (Adolfo Suárez Madrid-Barajas), Barcelona (Josep Tarradellas Barcelona-El Prat), Palma de Mallorca (Son Sant Joan) y Málaga (Pablo Picasso).","• Puertos más importantes: Algeciras, Barcelona, Las Palmas, Bilbao, Valencia y Vigo.","Economía y trabajo La economía de España, en términos absolutos, ocupa la quinta posición en la Unión Europea y es la número 14 del mundo.","En términos relativos (poder adquisitivo), el FMI estima que España se encontraba en la posición 16 del mundo en 2024. La moneda de España es, desde 2002, el euro; antes era la peseta.","Características de la economía española En primer lugar, se encuentra el sector terciario (servicios), en segundo lugar, se sitúa el sector secundario (industria y construcción) y, en tercer lugar, el primario (agricultura, pesca y ganadería).","El PIB per cápita en España se sitúa por debajo de la media de la UE (en la UE el PIB per cápita ronda los 38 000 € y en España unos 30 700 € en 2024). Las comunidades con mayor PIB por habitante son Madrid, País Vasco, Navarra y Cataluña; y con un menor índice son Andalucía, Melilla y Extremadura.","El mercado laboral español se caracteriza por una alta tasa de paro (10,29 % según datos del INE en el segundo trimestre de 2025), así como una tasa de contratos temporales todavía elevada, aunque en descenso tras la reforma laboral de 2022.","Las empresas españolas destacan en las actividades relacio-","nadas con las infraestructuras y las telecomunicaciones; los sectores ferroviario, financiero y textil; y el turismo. Respecto al turismo, el Gobierno informó de que 93,8 millones de turistas internacionales visitaron España en 2023. Según el informe de 2017 de la Organización Mundial de Turismo (OMT), España es el tercer país del mundo en número de turistas extranjeros. El sector turístico es un motor importante en el aumento de nuevos empleos.","España importa petróleo y derivados, componentes del automóvil, textiles, confección, etc.; y exporta automóviles, frutas y legumbres, vino, aceite, calzado, medicamentos, etc. Estas transacciones se realizan principalmente con países de la Unión Europea.","España cuenta con una importante posición en innovación, con desarrollos importantes en energías renovables, en biotecnología, en el sector farmacéutico, de transportes y en las pequeñas y medianas industrias tecnológicas.","Algunas de las instituciones económicas más importantes de España son el Banco de España, la Bolsa (el IBEX 35), el Instituto Español de Comercio Exterior (ICEX), el Consejo Económico y Social de España (CES) o la Seguridad Social de España. La edad mínima para trabajar en España es de 16 años. Las personas pueden ser clasificadas como:","• ocupadas (personas que tienen un empleo);","• paradas o desempleadas (personas mayores de 16 años que se encuentran sin trabajo, pero están disponibles","para ejercer uno);","• inactivas (personas no incluidas en ninguno de los conceptos anteriores);","• y jubiladas (personas mayores que se han retirado).","Los empleados que trabajan en la Administración central, autonómica o local pueden ser funcionarios o personal laboral.","La ley laboral más importante es el Estatuto de los Trabajadores. Los convenios colectivos son acuerdos que se firman entre la empresa y los representantes de los trabajadores (sindicatos) sobre las condiciones laborales. Existe una Comisión Consultiva Nacional de Convenios Colectivos (CCNCC), en la que están representadas la Administración General del Estado, las organizaciones sindicales y las asociaciones empresariales más importantes.","Respecto a la política fiscal o de pago de impuestos, en España se distinguen:","• Impuestos directos: se aplican sobre la posesión de un patrimonio y la obtención de una renta, como el Impuesto sobre la Renta de las Personas Físicas (IRPF), el Impuesto sobre la Renta de no Residentes o el Impuesto de Sociedades. Anualmente, particulares y empresas deben realizar la declaración de la renta para pagar los impuestos al Estado.","• Impuestos indirectos: se aplican al consumo o por actos de transmisión como el IVA o los Impuestos Especiales, sobre el alcohol y bebidas alcohólicas, los hidrocarburos, el tabaco o la matriculación de medios de transporte."]}]}],"expl":{"1001":"La Constitución dice que la forma política del Estado español es la monarquía parlamentaria (art. 1.3): el rey es el jefe del Estado, pero gobiernan el Gobierno y las Cortes elegidas por los ciudadanos. España no es una república ni un Estado federal.","1002":"La Constitución es la «ley de leyes» o ley fundamental de España. Se aprobó en 1978 y todas las demás normas deben respetarla.","1003":"La soberanía nacional reside en el pueblo español, del que emanan todos los poderes del Estado (art. 1.2). El Gobierno y el Congreso ejercen poderes que les da el pueblo.","1004":"El Instituto de las Mujeres es un organismo público español, adscrito al Ministerio de Igualdad, que promueve la igualdad entre mujeres y hombres. No es europeo ni una ONG.","1005":"La sede electrónica de una Administración funciona las 24 horas, todos los días del año. Puedes hacer trámites por internet a cualquier hora.","1006":"El castellano es la lengua oficial del Estado en todo el territorio (art. 3.1). Las demás lenguas (catalán, gallego, euskera…) son cooficiales solo en sus comunidades autónomas.","1007":"La Policía Foral de Navarra es una policía autonómica: solo actúa en Navarra. La Policía Local es municipal y la Guardia Civil es estatal.","1008":"El Cuerpo Nacional de Policía es estatal y actúa en toda España, igual que la Guardia Civil. La Policía Foral solo está en Navarra y los Mossos d’Esquadra solo en Cataluña.","1009":"La Constitución separa tres poderes: el ejecutivo (el Gobierno), el legislativo (las Cortes Generales) y el judicial (los jueces y tribunales).","1010":"La bandera de España debe estar en el exterior de todos los edificios públicos y en los actos oficiales. En las comunidades autónomas se coloca junto a la bandera autonómica.","1011":"El rey es el jefe del Estado y su máximo representante (art. 56). El presidente del Gobierno dirige el Gobierno, no el Estado.","1012":"La gestión de la sanidad está transferida a las comunidades autónomas: cada una organiza sus hospitales y centros de salud. El Estado fija las bases y coordina.","1013":"Adolfo Suárez, de la Unión de Centro Democrático (UCD), fue el primer presidente del Gobierno de la democracia. Rajoy y Zapatero gobernaron muchos años después.","1014":"El Tribunal Constitucional es el intérprete supremo de la Constitución: decide si las leyes la respetan y protege los derechos fundamentales con el recurso de amparo.","1015":"La Constitución dice que el rey arbitra y modera el funcionamiento regular de las instituciones (art. 56). No gobierna, pero actúa como mediador.","1016":"El Senado es la cámara de representación territorial (art. 69): representa a las provincias, islas y comunidades autónomas. El Congreso es la otra cámara de las Cortes.","1017":"Para hacer trámites por internet hay que identificarse con una firma electrónica: un certificado digital, el DNI electrónico o el sistema Cl@ve.","1018":"Los españoles aprobaron la Constitución en referéndum el 6 de diciembre de 1978. Por eso ese día es fiesta nacional (Día de la Constitución).","1019":"El Estatuto de Autonomía es la norma institucional básica de cada comunidad autónoma: fija sus instituciones, competencias, símbolos y, si la tiene, su lengua cooficial.","1020":"Los ayuntamientos gestionan los servicios más cercanos a los vecinos, como polideportivos, piscinas, bibliotecas y centros culturales municipales.","1021":"El Gobierno dirige la Administración civil y militar y la defensa del Estado (art. 97). Las Cortes hacen las leyes y los ayuntamientos gobiernan los municipios.","1022":"En las Islas Baleares hay consejos insulares (Mallorca, Menorca, Ibiza y Formentera) en lugar de diputaciones. Los cabildos son de Canarias.","1023":"Barcelona es la segunda ciudad más poblada de España, después de Madrid, con alrededor de 1,7 millones de habitantes. Sevilla y Zaragoza tienen menos de 700 000.","1024":"Las Cortes Generales representan al pueblo español (art. 66). Sus miembros, diputados y senadores, son elegidos por los ciudadanos.","1025":"El Congreso de los Diputados y el Senado forman las Cortes Generales, que ejercen el poder legislativo: hacen y aprueban las leyes.","1026":"Es la iniciativa legislativa popular: los ciudadanos pueden presentar una proposición de ley al Congreso si reúnen al menos 500 000 firmas (art. 87.3).","1027":"España tiene 17 comunidades autónomas y 2 ciudades autónomas, Ceuta y Melilla.","1028":"La bandera de España tiene tres franjas horizontales: roja, amarilla y roja. La amarilla es el doble de ancha que cada roja.","1029":"El Gobierno de España tiene su sede en Madrid, la capital, en el Palacio de la Moncloa.","1030":"La bandera de la Unión Europea es azul con 12 estrellas amarillas en círculo. El número 12 simboliza la unión y la perfección; no corresponde al número de países.","1031":"En las elecciones municipales se vota a las listas de concejales de cada municipio, y después los concejales eligen al alcalde. Ministros no se eligen en elecciones; diputados y senadores, en las generales.","1032":"El euskera o vasco es lengua cooficial en el País Vasco y en la zona vascohablante de Navarra. El bable (asturiano) y el aragonés no son lenguas cooficiales.","1033":"La Constitución dice que el castellano es la lengua oficial del Estado y que todos los españoles tienen el deber de conocerla y el derecho a usarla (art. 3.1).","1034":"El aranés es cooficial en Cataluña. Se habla en el Valle de Arán, un pequeño territorio de los Pirineos, en la provincia de Lleida.","1035":"Cada comunidad autónoma tiene tres instituciones: la asamblea legislativa (su parlamento), el consejo de gobierno y el presidente. El ayuntamiento es municipal y la delegación del Gobierno representa al Estado.","1036":"El gallego es cooficial en Galicia. El aragonés no tiene rango de lengua cooficial y el murciano es una forma de hablar el castellano, no una lengua.","1037":"El Instituto Cervantes, creado en 1991, promueve la enseñanza del español y difunde la cultura en español por el mundo. También organiza los exámenes DELE y esta prueba CCSE.","1038":"La Real Academia Española trabaja en la normalización del español: fija sus normas con el diccionario, la gramática y la ortografía. El Instituto Cervantes y el Institut Ramon Llull se dedican a difundir lenguas y culturas.","1039":"El presidente del Gobierno vive y trabaja en el Palacio de la Moncloa, en Madrid. El rey vive en el Palacio de la Zarzuela y el Palacio Real se usa para actos oficiales.","1040":"Las Fuerzas Armadas son el Ejército de Tierra, la Armada y el Ejército del Aire y del Espacio. La Guardia Civil es un cuerpo de seguridad del Estado y la Policía Foral es la policía de Navarra.","1041":"El Gobierno lo forman el presidente, los vicepresidentes y los ministros (art. 98). Los concejales y los alcaldes forman los ayuntamientos.","1042":"La Constitución define España como un Estado social y democrático de Derecho (art. 1.1): respeta la ley, garantiza derechos sociales y se basa en la democracia.","1043":"PP son las siglas del Partido Popular. PIB significa producto interior bruto y UE, Unión Europea.","1044":"La persona heredera de la Corona tiene el título de Príncipe o Princesa de Asturias. Hoy es la princesa Leonor, hija del rey Felipe VI.","1045":"Juan Carlos I fue rey desde 1975, tras la muerte de Franco, y apoyó la Transición a la democracia. Carlos III reinó en el siglo XVIII y Alfonso XIII, a principios del XX.","1046":"La Constitución española se aprobó en 1978 y fue ratificada en referéndum el 6 de diciembre de ese año.","1047":"Todas las comunidades autónomas tienen su propia bandera, recogida en su Estatuto, y la usan junto a la de España en sus edificios y actos oficiales.","1048":"El Defensor del Pueblo defiende los derechos de las personas frente a las administraciones: recibe las quejas cuando una administración funciona mal. Es un alto comisionado de las Cortes Generales.","1049":"Para presentar una proposición de ley por iniciativa popular hacen falta, como mínimo, 500 000 firmas (art. 87.3 de la Constitución).","1050":"España pertenece al Fondo Monetario Internacional (FMI), además de a la ONU, la OTAN, la UE y el Consejo de Europa. La CEI y la Unión Económica Euroasiática agrupan a países de la antigua URSS.","1051":"La Administración tiene tres niveles: central (el Estado), autonómica (las comunidades) y local (los ayuntamientos y las diputaciones).","1052":"El poder legislativo corresponde a las Cortes Generales, es decir, a los diputados y senadores. El presidente y los ministros forman el poder ejecutivo, y los jueces, el judicial.","1053":"El rey vive en el Palacio de la Zarzuela, en Madrid. La Moncloa es la residencia del presidente del Gobierno y el Palacio de la Moneda está en Chile.","1054":"El nombre oficial del parlamento español es Cortes Generales. Está formado por dos cámaras: el Congreso de los Diputados y el Senado.","1055":"El ICEX, el Instituto de las Mujeres y la Dirección General de Tráfico dependen de ministerios: de Economía y Comercio, de Igualdad y de Interior, respectivamente.","1056":"En España pueden reinar tanto hombres como mujeres. La Corona es hereditaria, y la heredera actual es la princesa Leonor.","1057":"El Tribunal de Cuentas fiscaliza las cuentas y la gestión económica del Estado y depende directamente de las Cortes Generales (art. 136).","1058":"Por orden de protocolo, la tercera autoridad del Estado es el presidente del Congreso de los Diputados, después del rey y del presidente del Gobierno.","1059":"En las Islas Baleares es cooficial el catalán, junto con el castellano. El gallego se habla en Galicia y el euskera en el País Vasco y Navarra.","1060":"Los valores superiores de la Constitución son la libertad, la justicia, la igualdad y el pluralismo político (art. 1.1).","1061":"Muchas leyes, después de aprobarse, necesitan normas que las desarrollen (por ejemplo, reglamentos del Gobierno) para poder aplicarse en la práctica.","1062":"España tiene alrededor de 49 millones de habitantes, según los datos recogidos en el manual.","1063":"El Consejo de Estado es el supremo órgano consultivo del Gobierno (art. 107): le da su opinión sobre leyes y decisiones importantes. El Tribunal Constitucional es un tribunal, no un órgano consultivo.","1064":"El Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado (art. 97).","1065":"El Defensor del Pueblo es un alto comisionado de las Cortes Generales: lo eligen el Congreso y el Senado y les rinde cuentas.","1066":"El Instituto Vasco Etxepare difunde el euskera y la cultura vasca en el exterior, igual que el Instituto Cervantes hace con el español.","1067":"Málaga está entre las diez ciudades más pobladas de España (es la sexta). Cádiz y Albacete tienen muchos menos habitantes.","1068":"Cualquier ciudadano puede hacer trámites en línea ante la Administración, identificándose con certificado digital, DNI electrónico o Cl@ve.","1069":"El rey de España es Felipe VI, proclamado el 19 de junio de 2014. Juan Carlos I es su padre y Alfonso XIII reinó a principios del siglo XX.","1070":"El Consejo General del Poder Judicial (CGPJ) es el órgano de gobierno de los jueces y magistrados. El Tribunal Supremo es el tribunal más alto, y el Consejo de Estado asesora al Gobierno.","1071":"El Gobierno elabora los presupuestos generales del Estado, pero quien los aprueba son las Cortes Generales (art. 134). El Tribunal de Cuentas los fiscaliza después.","1072":"La Constitución es la ley fundamental de España: está por encima de todas las demás leyes.","1073":"Las Cortes Generales están formadas por dos cámaras: el Congreso de los Diputados y el Senado.","1074":"El poder legislativo, es decir, las Cortes Generales, elabora y aprueba las leyes. El ejecutivo las aplica y el judicial juzga según ellas.","1075":"Las Fuerzas Armadas tienen la misión de garantizar la soberanía y la independencia de España y defender su integridad territorial (art. 8). La Policía y la Guardia Civil se ocupan de la seguridad ciudadana.","1076":"Desde 1989, el Ejército español participa en misiones de paz de la ONU (la primera fue en Angola). La OEI es una organización educativa y cultural, y la «Unión Europea Occidental» no existe hoy.","1077":"La Guardia Civil vigila puertos, aeropuertos, fronteras y costas. También controla el tráfico en las carreteras y la seguridad en las zonas rurales.","1078":"La Policía Nacional controla los pasaportes en las fronteras, además de expedir el DNI y el pasaporte y ocuparse de la extranjería.","1079":"José María Aznar, del Partido Popular, fue presidente del Gobierno de 1996 a 2004. Manuel Fraga fue ministro y presidente de Galicia, y Yolanda Díaz ha sido vicepresidenta.","1080":"Los Mossos d’Esquadra son la policía autonómica de Cataluña. La Ertzaintza es la del País Vasco y la Guardia Civil es estatal.","1081":"La Ertzaintza es la policía autonómica del País Vasco. Los Mossos d’Esquadra son de Cataluña y la Guardia Civil es estatal.","1082":"Felipe VI es rey desde 2014: fue proclamado el 19 de junio de ese año, tras la abdicación de Juan Carlos I.","1083":"La Policía Local regula el tráfico dentro de los pueblos y ciudades. En las carreteras lo vigila la Guardia Civil.","1084":"Cualquier persona, española o extranjera, de cualquier edad y situación, puede presentar una queja gratuita al Defensor del Pueblo.","1085":"En España votar es un derecho, no una obligación: nadie está obligado a votar ni recibe una multa por no hacerlo.","1086":"La Guardia Civil, a través de su Agrupación de Tráfico, vigila el tráfico en las carreteras. Dentro de las ciudades lo hace la Policía Local.","1087":"La Agencia Tributaria (Hacienda) recauda los impuestos. El Tribunal de Cuentas controla cómo gasta el dinero el Estado.","1088":"Las leyes nacionales se publican en el Boletín Oficial del Estado (BOE). Cada comunidad autónoma tiene además su propio boletín.","1089":"Los cabildos son los órganos de gobierno de cada isla y solo existen en Canarias. En Baleares hay consejos insulares y en las demás provincias, diputaciones.","1090":"Los impuestos se pueden pagar en la sede electrónica de la Agencia Tributaria. Para el DNI o el pasaporte hay que ir en persona a una oficina de expedición, con cita.","1091":"El 060 es el teléfono de información de la Administración General del Estado. El 091 es la Policía Nacional y el 010 es un servicio de información municipal en muchas ciudades.","1092":"España está organizada territorialmente en comunidades autónomas, además de provincias y municipios. No tiene cantones ni estados federales.","1093":"En España hay muchos partidos políticos: la Constitución reconoce el pluralismo político y los ciudadanos pueden crear partidos libremente.","1094":"La investidura tiene lugar en el Congreso de los Diputados: el candidato presenta su programa y los diputados votan si le dan su confianza.","1095":"El rey tiene el mando supremo de las Fuerzas Armadas (art. 62). El Gobierno, con el Ministerio de Defensa, dirige la política de defensa.","1096":"El delegado del Gobierno representa al Estado en cada comunidad autónoma y dirige allí la Administración del Estado (art. 154). El presidente autonómico dirige el gobierno de la comunidad.","1097":"España tiene 50 provincias, además de las ciudades autónomas de Ceuta y Melilla.","1098":"La enseñanza de las lenguas cooficiales (catalán, gallego, euskera…) es competencia de las comunidades autónomas donde son oficiales.","1099":"El poder ejecutivo corresponde al Gobierno. El Congreso y el Senado tienen el legislativo, y los jueces y magistrados, el judicial.","1100":"El Parlamento español tiene dos cámaras: el Congreso de los Diputados y el Senado. Por eso se dice que es bicameral.","1101":"Los ayuntamientos se encargan de servicios básicos como el suministro de agua, el alumbrado público, la limpieza de las calles y la recogida de basuras.","1102":"La nacionalidad, la inmigración, la emigración y la extranjería son competencias exclusivas del Estado (art. 149). Las comunidades autónomas no las gestionan.","1103":"Según el manual, ninguna mujer ha sido presidenta del Gobierno de España. Sí ha habido vicepresidentas y ministras.","1104":"Las relaciones internacionales son competencia exclusiva del Estado (art. 149): el Gobierno dirige la política exterior.","1105":"El ayuntamiento lo forman el alcalde y los concejales, elegidos en las elecciones municipales.","1106":"El gobierno de cada comunidad autónoma lo forman su presidente y los consejeros, que dirigen las consejerías. Los ministros forman el Gobierno de España y los concejales, el ayuntamiento.","1107":"El órgano de gobierno de los municipios es el ayuntamiento. La diputación gobierna la provincia y el cabildo, cada isla de Canarias.","1108":"Las provincias se gobiernan mediante las diputaciones provinciales. Los cabildos existen en Canarias y los consejos insulares, en Baleares.","1109":"El Gobierno es el órgano superior del poder ejecutivo. Las Cortes Generales tienen el poder legislativo y las Fuerzas Armadas se ocupan de la defensa.","1110":"El español también se llama castellano. La Constitución usa la palabra «castellano» (art. 3). El aragonés y el leonés son otras lenguas o variedades de la península.","1111":"En las elecciones al Parlamento Europeo se elige a los eurodiputados, cada cinco años.","1112":"Los españoles pueden votar a partir de los 18 años, que es la mayoría de edad.","1113":"En las elecciones municipales pueden votar los ciudadanos de la Unión Europea residentes en España y los de algunos países con los que España tiene acuerdos de reciprocidad.","1114":"El Tribunal de Cuentas controla la gestión económica y financiera del Estado. La Agencia Tributaria recauda los impuestos y el Banco de España supervisa a los bancos.","1115":"En las elecciones generales se elige a los diputados del Congreso y a los senadores. Los eurodiputados se eligen en las europeas y los concejales, en las municipales.","1116":"El Congreso de los Diputados tiene 350 miembros, elegidos en las elecciones generales.","1117":"Los municipios y las provincias forman la Administración local. Las comunidades forman la autonómica y el Estado, la central.","1118":"Andalucía es la comunidad autónoma más poblada, con unos 8,6 millones de habitantes. Le siguen Cataluña (unos 8 millones) y Madrid.","1119":"Los sindicatos, como CCOO o UGT, defienden los intereses de los trabajadores y negocian con las empresas y el Gobierno.","1120":"El Congreso de los Diputados elige al presidente del Gobierno en la votación de investidura. Después, el rey lo nombra formalmente.","2001":"Falso. España es un Estado aconfesional y la Constitución garantiza la libertad religiosa (art. 16): nadie está obligado a practicar ninguna religión.","2002":"Falso. Quien obtiene la nacionalidad española tiene los mismos derechos que cualquier otro español, incluido el voto, sin tener que esperar tres años.","2003":"Verdadero. La Constitución prohíbe la tortura y los tratos inhumanos o degradantes y abolió la pena de muerte (art. 15).","2004":"Verdadero. La Constitución exige que la estructura interna y el funcionamiento de los partidos políticos sean democráticos (art. 6).","2005":"Falso. Nadie puede ser obligado a declarar su ideología, su religión o sus creencias (art. 16.2).","2006":"Falso. Los españoles tienen derecho a entrar y salir libremente de España, y ese derecho no puede limitarse por motivos políticos o ideológicos (art. 19).","2007":"Verdadero. La Educación Primaria, de 6 a 12 años, es obligatoria y gratuita. La enseñanza obligatoria dura hasta los 16 años.","2008":"Verdadero. La Constitución reconoce el derecho de todos los españoles a disfrutar de una vivienda digna y adecuada (art. 47).","2009":"Falso. El domicilio es inviolable: la policía solo puede entrar con permiso del titular, con una resolución judicial o si se está cometiendo un delito flagrante (art. 18.2).","2010":"Verdadero. Se garantiza el secreto de las comunicaciones (postales, telefónicas…), salvo que un juez decida otra cosa (art. 18.3).","2011":"Verdadero. La Constitución reconoce el derecho de asociación (art. 22): las asociaciones solo tienen que inscribirse en un registro.","2012":"Verdadero. La Constitución reconoce la libertad de cátedra (art. 20): los profesores enseñan con libertad, dentro del respeto a la Constitución y a las leyes.","2013":"Falso. Muchos derechos fundamentales, como la vida, la integridad o la libertad religiosa, son de todas las personas, también de los extranjeros.","2014":"Verdadero. Todos están obligados a colaborar con los jueces y tribunales cuando lo pidan, por ejemplo, declarando como testigos (art. 118).","2015":"Verdadero. La ley protege los datos personales y limita que terceras personas accedan a ellos o los usen sin permiso (art. 18.4).","2016":"Verdadero. La libertad de expresión y de prensa tiene límites: el respeto al honor, a la intimidad y a la propia imagen de las personas (art. 20.4).","2017":"Verdadero. La Constitución dice que la ley regula el matrimonio y las causas de separación y divorcio (art. 32.2).","2018":"Falso. La sanidad pública atiende a toda la población, no solo a los mayores de 65 años.","2019":"Verdadero. Todos los españoles son iguales ante la ley, sin discriminación por sexo (art. 14). Hombres y mujeres tienen los mismos derechos.","2020":"Verdadero. La enseñanza obligatoria tiene dos etapas: la Educación Primaria (de 6 a 12 años) y la Educación Secundaria Obligatoria, ESO (de 12 a 16).","2021":"Falso. España es aconfesional: ninguna religión tiene carácter estatal (art. 16.3), aunque el Estado colabora con las distintas confesiones.","2022":"Verdadero. La atención sanitaria pública es gratuita en el momento de usarla, porque se paga con los impuestos. Los medicamentos pueden tener un copago.","2023":"Falso. La enseñanza básica es un derecho de todos, españoles y extranjeros, y es obligatoria y gratuita.","2024":"Verdadero. El derecho de asociación está reconocido en la Constitución (art. 22).","2025":"Verdadero. Los sindicatos más representativos negocian con los empresarios y con el Gobierno las condiciones de trabajo y las reformas laborales.","2026":"Verdadero. La Constitución reconoce el derecho de los trabajadores a la huelga para defender sus intereses (art. 28.2).","2027":"Falso. La libertad ideológica está garantizada en todo el territorio nacional y para todas las personas (art. 16).","2028":"Falso. La Seguridad Social pública es para todos los ciudadanos, y precisamente protege a quien está en desempleo (art. 41).","2029":"Verdadero. Todos tienen derecho a un medio ambiente adecuado y el deber de conservarlo (art. 45).","2030":"Verdadero. Los poderes públicos deben proteger la salud pública y fomentar la educación física y el deporte (art. 43).","2031":"Verdadero. La enseñanza básica es obligatoria y gratuita (art. 27.4).","2032":"Verdadero. Nadie puede ser discriminado por nacimiento, raza, sexo, religión, opinión ni cualquier otra circunstancia personal o social (art. 14).","2033":"Verdadero. Los españoles pueden circular libremente por todo el territorio nacional (art. 19).","2034":"Falso. Los jueces son independientes y solo están sometidos a la ley (art. 117). El Gobierno no les da indicaciones.","2035":"Verdadero. La ley puede fijar deberes para los ciudadanos en casos de grave riesgo, catástrofe o calamidad pública (art. 30.4).","2036":"Verdadero. Los españoles tienen derecho a elegir libremente dónde residir (art. 19).","3001":"Cáceres y Badajoz son las dos provincias de Extremadura, en el oeste de España, junto a Portugal. La capital de la comunidad es Mérida.","3002":"La capital de la Comunidad Valenciana es Valencia. Alicante y Castellón son las otras dos provincias de la comunidad.","3003":"Las Islas Baleares (Mallorca, Menorca, Ibiza y Formentera) están en el mar Mediterráneo. Las Canarias están en el océano Atlántico.","3004":"La Meseta Central es la gran llanura elevada que ocupa el centro de la península ibérica. Una cordillera es una cadena de montañas y una marisma, un terreno bajo e inundable junto al mar.","3005":"El parque nacional de Ordesa y Monte Perdido está en los Pirineos de Huesca, en Aragón.","3006":"Guadalajara y Cuenca están en Castilla-La Mancha, junto con Albacete, Ciudad Real y Toledo.","3007":"Santiago de Compostela es la capital de Galicia. La de Asturias es Oviedo y la de Cantabria, Santander.","3008":"Almería es una provincia de Andalucía, en el sureste. Las ocho provincias andaluzas son Almería, Cádiz, Córdoba, Granada, Huelva, Jaén, Málaga y Sevilla.","3009":"La capital de Galicia es Santiago de Compostela, sede de la Xunta. A Coruña y Vigo son ciudades más grandes, pero no son la capital.","3010":"El Júcar desemboca en el mar Mediterráneo, en Cullera (Valencia). El Tajo y el Duero atraviesan Portugal y desembocan en el océano Atlántico.","3011":"El Aneto, de unos 3400 metros, es el pico más alto de los Pirineos. Está en la provincia de Huesca.","3012":"Vitoria-Gasteiz es la sede del Gobierno y del Parlamento del País Vasco. La capital de Navarra es Pamplona y la de La Rioja, Logroño.","3013":"España se divide territorialmente en 17 comunidades autónomas y 2 ciudades autónomas (Ceuta y Melilla).","3014":"El parque nacional de Aigüestortes i Estany de Sant Maurici está en los Pirineos de Lleida, en Cataluña.","3015":"Ceuta y Melilla son las dos ciudades autónomas españolas situadas en el norte de África. Almería y Cádiz están en Andalucía.","3016":"Madrid tiene un clima de interior con inviernos fríos y veranos muy calurosos. Canarias es suave todo el año y la costa valenciana es mediterránea, con inviernos templados.","3017":"El Guadalquivir desemboca en el océano Atlántico, en Sanlúcar de Barrameda (Cádiz). El Júcar va al Mediterráneo y el Manzanares es un río pequeño que pasa por Madrid.","3018":"Burgos pertenece a Castilla y León, que tiene nueve provincias: Ávila, Burgos, León, Palencia, Salamanca, Segovia, Soria, Valladolid y Zamora. Huesca es de Aragón y Guadalajara, de Castilla-La Mancha.","3019":"Huesca está en Aragón, que tiene tres provincias: Huesca, Teruel y Zaragoza.","3020":"Canarias tiene un clima subtropical, con temperaturas suaves durante todo el año. El clima mediterráneo es propio de la costa este y el oceánico, del norte peninsular.","3021":"El Ebro es el principal río que desemboca en el Mediterráneo, en el delta del Ebro (Tarragona). El Duero y el Tajo desembocan en el Atlántico.","3022":"España es uno de los países más montañosos de Europa: tiene muchas cordilleras y una altitud media alta por la Meseta Central.","3023":"El parque nacional de Monfragüe está en la provincia de Cáceres, en Extremadura.","3024":"Mérida es la capital de Extremadura. Cáceres y Badajoz son las dos provincias de la comunidad.","4001":"En el Quijote, de Miguel de Cervantes, los protagonistas son don Quijote y su escudero Sancho Panza. Don Juan y doña Inés son personajes de Don Juan Tenorio, de José Zorrilla.","4002":"Margarita Salas fue una bioquímica, discípula de Severo Ochoa, reconocida por sus investigaciones en biología molecular. Almudena Grandes fue escritora y Montserrat Caballé, soprano.","4003":"La casa de Bernarda Alba es una obra de teatro de Federico García Lorca. Cervantes escribió el Quijote y Antonio Machado fue poeta.","4004":"Carmen Laforet escribió Nada (1945), una novela sobre la posguerra que ganó el primer Premio Nadal. María Dueñas es la autora de El tiempo entre costuras.","4005":"El amor brujo es una obra de Manuel de Falla. Joaquín Rodrigo compuso el Concierto de Aranjuez e Isaac Albéniz, la suite Iberia.","4006":"En la Noche de San Juan (23 de junio) es típico encender hogueras. Las uvas se comen en Nochevieja y los libros se regalan en Sant Jordi (23 de abril).","4007":"La guitarra es el instrumento más característico del flamenco, junto con el cante y el baile. La gaita es típica de Galicia y Asturias.","4008":"Isabel Coixet es una directora de cine española, con películas como La vida secreta de las palabras, que ganó el Goya a la mejor película.","4009":"Rosalía es una de las cantantes españolas más famosas hoy en el mundo. Marisol y Lola Flores fueron muy populares en décadas pasadas.","4010":"La Mezquita-Catedral de Córdoba es Patrimonio de la Humanidad. Se construyó en la época de Al-Ándalus.","4011":"La Alhambra, palacio y fortaleza nazarí, está en Granada y es Patrimonio de la Humanidad.","4012":"Pilar Miró fue una directora de cine y televisión que modernizó el cine español (El crimen de Cuenca) y dirigió RTVE. Sara Baras es bailaora y Penélope Cruz, actriz.","4013":"Irene Vallejo escribió El infinito en un junco, un libro de gran éxito sobre la historia de los libros. El tiempo entre costuras es de María Dueñas y El camino, de Miguel Delibes.","4014":"El Consejo Superior de Investigaciones Científicas (CSIC) es la mayor institución pública dedicada a la investigación en España. La RAE se ocupa de la lengua y la SGAE, de los derechos de autor.","4015":"Paco de Lucía fue un guitarrista flamenco de fama mundial.","4016":"El 24 de diciembre es Nochebuena, la noche antes de Navidad, que se celebra con una cena en familia.","4017":"Juan Mari Arzak es un famoso cocinero vasco, uno de los creadores de la nueva cocina vasca. Su restaurante está en San Sebastián.","4018":"Clara Campoamor fue una política y abogada que defendió los derechos de la mujer y consiguió que se aprobara el voto femenino en España en 1931.","4019":"En Navidad se cantan villancicos. El flamenco es un arte andaluz y la jota, un baile típico de Aragón y otras regiones.","4020":"La Liga y la Copa del Rey son las principales competiciones de fútbol en España. También existen en baloncesto.","4021":"Vicente Aleixandre, poeta de la Generación del 27, recibió el Nobel de Literatura en 1977. Picasso fue pintor y María Zambrano, filósofa.","4022":"Los sanfermines se celebran en Pamplona del 6 al 14 de julio; el 7 es el día de San Fermín. Las Fallas son en Valencia en marzo y la Feria de Abril, en Sevilla.","4023":"Teresa Perales (natación) y Daniel Molina (paratriatlón) son campeones paralímpicos españoles.","4024":"En Nochevieja se toman doce uvas, una con cada campanada de medianoche, para recibir el año nuevo.","4025":"Maruja Mallo, pintora de la Generación del 27, pintó La verbena. Carmen Maura y Clara Lago son actrices.","4026":"El Guernica de Picasso está en el Museo Nacional Centro de Arte Reina Sofía, en Madrid. En el Prado están obras de Velázquez o Goya.","4027":"Mercè Rodoreda escribió en catalán; su obra más conocida es La plaça del Diamant. Almudena Grandes y Ana María Matute escribieron en castellano.","4028":"En la España medieval convivieron tres culturas: la cristiana, la judía y la musulmana.","4029":"El 6 de diciembre es el Día de la Constitución, porque ese día de 1978 se aprobó en referéndum. La llegada de Colón se recuerda el 12 de octubre y el Día del Libro es el 23 de abril.","4030":"Córdoba, capital del califato de Al-Ándalus, fue un gran centro científico donde se estudiaban medicina, astronomía y filosofía.","4031":"El Museo Guggenheim está en Bilbao. Lo diseñó el arquitecto Frank Gehry y se inauguró en 1997.","4032":"El Premio Cervantes es el premio más importante de las letras en español y se da a escritores.","4033":"Los Premios Goya reconocen a las mejores películas, actores y profesionales del cine español.","4034":"Los Premios Princesa de Asturias, que se entregan en Oviedo, premian logros científicos, culturales y humanísticos de todo el mundo.","4035":"El fútbol es el deporte más popular en España, con competiciones como la Liga y la Copa del Rey.","4036":"Carlos Alcaraz es tenista. Pau Gasol fue jugador de baloncesto y Carlos Sainz es piloto de automovilismo.","5001":"Los extranjeros que residen legalmente en España tienen la Tarjeta de Identidad de Extranjero (TIE), que incluye su NIE. El DNI es solo para españoles y el empadronamiento acredita el domicilio.","5002":"El certificado de empadronamiento lo expide el ayuntamiento y acredita dónde vives, porque estás inscrito en el padrón municipal.","5003":"El registro electrónico individual del Registro Civil sustituye al antiguo libro de familia: cada persona tiene un registro con sus datos de nacimiento, matrimonio, hijos, etc.","5004":"La edad mínima para conducir un coche en España (permiso B) es 18 años.","5005":"El carné de conducir lo expide la Dirección General de Tráfico (DGT), que también organiza los exámenes.","5006":"Para obtener el carné de conducir hay que aprobar dos exámenes: uno teórico y otro práctico.","5007":"El libro de familia se tramitaba en el Registro Civil, donde se inscriben nacimientos, matrimonios y defunciones.","5008":"Canal Sur es la televisión pública autonómica de Andalucía. Telecinco y Nova son canales privados de ámbito nacional.","5009":"El permiso por nacimiento y cuidado de un hijo, de maternidad o de paternidad, dura 19 semanas para cada progenitor, según el manual.","5010":"La tasa máxima de alcohol para los conductores en general es de 0,5 gramos por litro en sangre. Para conductores noveles y profesionales es más baja: 0,3 g/l.","5011":"La mayoría de los españoles vive en pisos dentro de edificios de viviendas, sobre todo en las ciudades.","5012":"Andalucía, y especialmente Jaén, es conocida por la calidad y la cantidad de su aceite de oliva.","5013":"La ITV (Inspección Té /* ================= Dates ================= */
const dayKey = (ts = Date.now()) => {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};
const startOfDay = (ts) => {
  const d = new Date(ts);

  return d.getTime();
};
function examTs() {
  const [y, m, d] = state.settings.examDate.split("-").map(Number);
  const [hh, mm] = state.settings.examTime.split(":").map(Number);
  return new Date(y, m - 1, d, hh, mm).getTime();
}
const daysLeft = () => Math.round((startOfDay(examTs()) - startOfDay(Date.now())) / DAY);
const fmtDay = (ts) => capFirst(new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" }).format(ts));
const fmtShort = (ts) => new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).format(ts);
const fmtClock = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));

/* ================= Learning model ================= */
const card = (id) => state.cards[id];
const seenQ = (q) => !!(state.cards[q.id] && state.cards[q.id].n);
function ensure(id) {
  return state.cards[id] || (state.cards[id] = { L: 0, due: 0, n: 0, ok: 0, ko: 0, conf: null, lastOk: false, last: 0, t: 0 });
}
function status(q) {
  const c = card(q.id);
  if (!c || !c.n) return "new";
  if (!c.lastOk) return "ko";
  if (c.conf === "dudaba" || c.conf === "adivine") return "dud";
  if (c.L >= 3) return "dom";
  return "apr";
}
function countStatus() {
  const c = { new: 0, apr: 0, dud: 0, ko: 0, dom: 0 };
  QS.forEach((q) => c[status(q)]++);
  return c;
}
const LEVEL_P = [0.45, 0.68, 0.8, 0.88, 0.93, 0.96];
function pKnow(q) {
  const g = q.t === 2 ? 0.5 : 1 / 3;
  const c = card(q.id);
  if (!c || !c.n) return g;
  let p = c.lastOk ? LEVEL_P[c.L] : 0.45;
  if (c.conf === "adivine") p = Math.min(p, 0.5);
  if (Date.now() > c.due + DAY) p *= 0.94;
  return Math.max(g, p);
}
function readiness() {
  const pt = {};
  TK.forEach((k) => {
    const qs = QS.filter((q) => q.t === k);
    pt[k] = qs.reduce((s, q) => s + pKnow(q), 0) / qs.length;
  });
  const ps = [];
  TK.forEach((k) => { for (let i = 0; i < TASKS[k].n; i++) ps.push(pt[k]); });
  let dist = [1];
  for (const p of ps) {
    const nx = new Array(dist.length + 1).fill(0);
    dist.forEach((v, j) => { nx[j] += v * (1 - p); nx[j + 1] += v * p; });
    dist = nx;
  }
  return { P: dist.slice(15).reduce((a, b) => a + b, 0), pt, mean: ps.reduce((a, b) => a + b, 0) };
}
const capDue = (ts) => {
  const cap = examTs() - 18 * HOUR;
  return Date.now() < cap && ts > cap ? cap : ts;
};
function today() {
  const k = dayKey();
  const d = state.days[k] || (state.days[k] = { n: 0, ok: 0, nu: 0, quota: null });
  if (d.quota == null) {
    const unseen = QS.filter((q) => !seenQ(q)).length;
    const left = daysLeft();
    d.quota = d.nu + (left <= 2 ? unseen : Math.ceil(unseen / (left - 2)));
  }
  return d;
}
function grade(id, correct, conf) {
  const d = today();
  const now = Date.now();
  const c = ensure(id);
  const first = c.n === 0;
  c.n++;
  c.last = now;
  c.t = now;
  c.lastOk = correct;
  if (!correct) {
    c.ko++;
    c.L = 0;
    c.conf = null;
    c.due = now + 5 * MIN;
  } else {
    c.ok++;
    c.conf = conf || "sabia";
    if (c.conf === "adivine") {
      c.L = Math.max(0, c.L - 1);
      c.due = now + 10 * MIN;
    } else if (c.conf === "dudaba") {
      c.L = Math.max(1, Math.min(c.L, 2));
      c.due = now + (c.L >= 2 ? DAY : 10 * HOUR);
    } else {
      c.L = Math.min(5, c.L + 1);
      c.due = now + [0, DAY, 2 * DAY, 3 * DAY, 5 * DAY, 8 * DAY][c.L];
    }
  }
  c.due = capDue(c.due);
  d.n++;
  if (correct) d.ok++;
  if (first) d.nu++;
  save();
}
const dueIds = (t) =>
  QS.filter((q) => (!t || q.t === t) && seenQ(q) && card(q.id).due <= Date.now())
    .sort((a, b) => card(a.id).due - card(b.id).due)
    .map((q) => q.id);
function pickNew(n, t) {
  if (n <= 0) return [];
  const pools = {}, seen = {}, total = {};
  TK.forEach((k) => { pools[k] = []; seen[k] = 0; total[k] = 0; });
  for (const q of QS) {
    if (t && q.t !== t) continue;
    total[q.t]++;
    if (seenQ(q)) seen[q.t]++;
    else pools[q.t].push(q.id);
  }
  const out = [];
  while (out.length < n) {
    let best = 0, bestRatio = Infinity;
    TK.forEach((k) => {
      if (!pools[k].length) return;
      const r = seen[k] / total[k];
      if (r < bestRatio) { bestRatio = r; best = k; }
    });
    if (!best) break;
    out.push(pools[best].shift());
    seen[best]++;
  }
  return out;
}
const weakest = (n, t) =>
  QS.filter((q) => (!t || q.t === t) && seenQ(q)).sort((a, b) => pKnow(a) - pKnow(b)).slice(0, n).map((q) => q.id);
function buildQueue(kind, x) {
  let ids = [];
  if (kind === "hoy") {
    ids = dueIds().slice(0, BATCH);
    const d = today();
    ids = ids.concat(pickNew(Math.min(BATCH - ids.length, d.quota - d.nu)));
  } else if (kind === "extra") {
    ids = pickNew(BATCH);
    if (!ids.length) ids = weakest(BATCH);
  } else if (kind === "tarea") {
    ids = dueIds(x).slice(0, BATCH);
    ids = ids.concat(pickNew(BATCH - ids.length, x));
    if (!ids.length) ids = weakest(BATCH, x);
  } else if (kind === "fallos") {
    ids = QS.filter((q) => status(q) === "ko").map((q) => q.id);
  } else if (kind === "dudosas") {
    ids = QS.filter((q) => status(q) === "dud").map((q) => q.id);
  } else if (kind === "ids") {
    ids = String(x).split(",").map(Number).filter((id) => QMAP.has(id));
  }
  return shuffle(ids).slice(0, 30);
}

/* ================= Sync (claude.ai db) ================= */
function merge(a, b) {
  const resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
  const out = { ...a, resetAt, cards: {}, days: { ...a.days }, settings: { ...a.settings } };
  const put = (id, c) => {
    if ((c.t || 0) > resetAt && (!out.cards[id] || (c.t || 0) > (out.cards[id].t || 0))) out.cards[id] = { ...c };
  };
  Object.entries(a.cards || {}).forEach(([id, c]) => put(id, c));
  Object.entries(b.cards || {}).forEach(([id, c]) => put(id, c));
  Object.entries(b.days || {}).forEach(([k, d]) => {
    if (!out.days[k] || (d.n || 0) > (out.days[k].n || 0)) out.days[k] = { ...d };
  });
  if (((b.settings && b.settings.t) || 0) > (a.settings.t || 0)) out.settings = { ...defaultState().settings, ...b.settings };
  const sims = new Map();
  [...(a.sims || []), ...(b.sims || [])].forEach((s) => {
    if (s.date > resetAt && !sims.has(s.id)) sims.set(s.id, JSON.parse(JSON.stringify(s)));
  });
  out.sims = [...sims.values()].sort((x, y) => y.date - x.date).slice(0, 30);
  return out;
}
const sync = {
  ref: null,
  timer: null,
  status: "local",
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const db = await window.claude.use("db");
      if (!db) return;
      this.ref = db.doc("apto/progreso");
      await this.pull();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") this.pull();
        else this.flush();
      });
    } catch (e) {
      this.status = "local";
      header();
    }
  },
  async pull() {
    if (!this.ref) return;
    try {
      const snap = await this.ref.get();
      if (snap.exists) {
        state = merge(state, snap.data());
        saveLocal();
        if (!["sesion", "simrun"].includes(ui.view)) render();
      }
      this.status = "ok";
    } catch (e) {
      this.status = "error";
    }
    header();
  },
  schedule() {
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 2500);
  },
  flush() {
    if (this.timer) {
      clearTimeout(this.timer);
      this.push();
    }
  },
  async push() {
    if (!this.ref) return;
    this.timer = null;
    try {
      const snap = await this.ref.get();
      if (snap.exists) {
        state = merge(state, snap.data());
        saveLocal();
      }
      const { simRun, ...rest } = state;
      await this.ref.set(JSON.parse(JSON.stringify(rest)));
      this.status = "ok";
    } catch (e) {
      this.status = "error";
    }
    header();
  },
};

const hasSpeech = "speechSynthesis" in window;
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find((v) => v.lang === "es-ES") || vs.find((v) => /^es/i.test(v.lang)) || null;
}
if (hasSpeech) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!hasSpeech) return toast("Este navegador no puede leer en voz alta.");
  speechSynthesis.cancel();
  const chunks = text.match(/[^.!?…]+[.!?…]*\s*/g) || [text];
  let buf = "";
  const parts = [];
  chunks.forEach((c) => {
    if ((buf + c).length > 220 && buf) { parts.push(buf); buf = ""; }
    buf += c;
  });
  if (buf) parts.push(buf);
  parts.forEach((p) => {
    const u = new SpeechSynthesisUtterance(p);
    u.lang = "es-ES";
    if (voice) u.voice = voice;
    u.rate = state.settings.rate || 1;
    speechSynthesis.speak(u);
  });
}
function stopSpeech() {
  if (hasSpeech) speechSynthesis.cancel();
}
function qText(q, order) {
  const L = LET(q);
  const ord = order || q.o.map((_, i) => i);
  return `${q.q} ${ord.map((oi, pos) => `${L[pos]}: ${q.o[oi]}`).join(". ")}`;
}

  if (ui.view === "simrun" && !state.simRun) ui.view = "simulacro";
  if ((ui.view === "sesion" || ui.view === "fin") && !ui.session) ui.view = "hoy";
  if (ui.view === "detalle" && !QMAP.has(ui.detail)) ui.view = "banco";
  const views = { hoy: vHoy, estudiar: vEstudiar, sesion: vSesion, fin: vFin, simulacro: vSimulacro, simrun: vSimRun, simres: vSimRes, temario: vTemario, banco: vBanco, detalle: vDetalle, ajustes: vAjustes };
  $view.innerHTML = views[ui.view]();
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === TAB_OF[ui.view] ? "page" : "false"));
  header();
}
function go(view) {
  ui.view = view;
  stopSpeech();
  render();
  window.scrollTo(0, 0);
}
function header() {
  const left = daysLeft();
  document.getElementById("exam-chip").textContent =
    left > 1 ? `Examen en ${left} días` : left === 1 ? "Examen mañana" : left === 0 ? "Examen hoy" : "Examen pasado";
  const s = document.getElementById("sync");
  s.hidden = sync.status === "local";
  s.textContent = sync.status === "ok" ? "Sincronizado" : "Sin sincronizar";
  s.className = "sync " + sync.status;
}
const chip = (q) => {
  const s = status(q);
  return `<span class="state s-${s}">${STATUS[s]}</span>`;
};
function explBlock(q) {
  const e = DATA.expl[q.id];
  return `<div class="expl">${e ? esc(e) : `<span class="muted">Explicación en preparación. Mientras tanto, repasa el temario de la Tarea ${q.t}.</span>`}
    <span class="src">Manual CCSE 2026 · pág. ${q.p} · <button class="linkish" data-act="temTask" data-arg="${q.t}">Temario T${q.t}</button></span></div>`;
}
const resumeBanner = () => {
  const s = ui.session;
  return s && s.i < s.ids.length && ui.view !== "sesion"
    ? `<button class="banner" data-act="go" data-arg="sesion"><strong>Tanda a medias</strong><span>Pregunta ${s.i + 1} de ${s.ids.length}. Toca para seguir.</span></button>`
    : "";
};
const simBanner = () =>
  state.simRun
    ? `<button class="banner" data-act="go" data-arg="simrun"><strong>Simulacro en marcha</strong><span>Quedan ${fmtClock(simRemaining())}. Toca para seguir.</span></button>`
    : "";
function streak() {
  let n = 0;
  let ts = Date.now();
  if (!(state.days[dayKey(ts)] && state.days[dayKey(ts)].n)) ts -= DAY;
  while (state.days[dayKey(ts)] && state.days[dayKey(ts)].n) { n++; ts -= DAY; }
  return n;
}

/* ---------- Hoy ---------- */

  return `${simBanner()}${resumeBanner()}
  <section class="panel">

    ${notThursday ? `<p class="note">Las convocatorias CCSE son en jueves. Comprueba la fecha en tu resguardo y cámbiala en <button class="linkish" data-act="go" data-arg="ajustes">Ajustes</button> si hace falta.</p>` : ""}

  <section class="panel">

    ${pending > 0
      ? `<div class="duo"><div><span class="big num">${due}</span><span class="muted">por repasar</span></div><div><span class="big num">${newLeft}</span><span class="muted">nuevas</span></div></div>
         <button class="btn" data-act="start" data-arg="hoy">${d.n ? "Seguir" : "Empezar"}: tanda de ${Math.min(BATCH, pending)}</button>`
      : `<p class="lead"><strong>Hecho por hoy.</strong> ${unseen ? "Has cubierto los repasos y las nuevas previstas." : "Ya has visto las 300: ahora toca repasar y hacer simulacros."}</p>
         <button class="btn secondary" data-act="start" data-arg="extra">${unseen ? "Adelantar 20 nuevas" : "Reforzar las 20 más flojas"}</button>`}
    <p class="muted">${unseen ? `Plan: ${d.quota} nuevas hoy para terminar las 300 dos días antes del examen.` : "Has visto las 300 preguntas."}</p>
  </section>
  <section class="panel">
    <div class="row"><div class="label">Probabilidad de APTO</div><span class="muted">objetivo 95 %</span></div>
    <div class="row"><span class="big num tone-${tone}">${P} %</span><span class="muted">${fmt1(r.mean)} aciertos esperados de 25</span></div>
    <div class="goal" role="img" aria-label="${P} % de probabilidad, objetivo 95 %"><i class="tone-bg-${tone}" style="width:${P}%"></i><b style="left:95%"></b></div>
    <div class="taskbars">${TK.map((k) => `<div class="taskbar"><span>T${k} · ${TASKS[k].short}</span><span class="bar"><i style="width:${pct(r.pt[k])}%"></i></span><span class="num">${pct(r.pt[k])} %</span></div>`).join("")}</div>
    <p class="muted">Dominio estimado por tarea. Lo que aún no has estudiado cuenta como respuesta al azar.</p>
  </section>
  <section class="panel">

    <div class="legend">${["dom", "apr", "dud", "ko", "new"].map((s) => `<button class="lg" data-act="bancoFilter" data-arg="${s}"><i class="c-${s}"></i>${STATUS_PL[s]} <span class="num">${counts[s]}</span></button>`).join("")}</div>

/* ---------- Estudiar ---------- */

    <label class="toggle"><input type="checkbox" data-set="shuffle" ${state.settings.shuffle ? "checked" : ""}><span><strong>Barajar opciones</strong><span class="muted">Aprendes el contenido, no la letra. El simulacro mantiene el orden del manual.</span></span></label>

/* ---------- Sesión ---------- */
function startSession(kind, ids) {
  if (!ids.length) return toast("No hay preguntas en esta lista.");
  ui.session = { kind, ids, i: 0, ok: 0, done: 0, answered: null, order: [], revealed: true, requeued: {} };
  prep();
  go("sesion");
}
function prep() {
  const s = ui.session;
  const q = QMAP.get(s.ids[s.i]);
  const c = card(q.id);
  s.answered = null;
  s.revealed = !(state.settings.recall && c && c.lastOk && c.L >= 2);
  s.order = state.settings.shuffle && q.o.length === 3 ? shuffle([0, 1, 2]) : q.o.map((_, i) => i);
}
function next() {
  const s = ui.session;
  stopSpeech();
  s.i++;
  if (s.i >= s.ids.length) return go("fin");
  prep();
  render();
  window.scrollTo(0, 0);
}
function vSesion() {
  const s = ui.session;
  if (s.i >= s.ids.length) return vFin();
  const q = QMAP.get(s.ids[s.i]);
  const L = LET(q);
  const a = s.answered;
  const head = `<div class="qhead"><button class="btn small secondary" data-act="go" data-arg="hoy">Salir</button><span class="qmeta">${s.i + 1} / ${s.ids.length}</span>${chip(q)}</div>
    <div class="progress"><i style="width:${(s.i / s.ids.length) * 100}%"></i></div>
    <div class="qmeta">T${q.t} · ${TASKS[q.t].short} · nº ${q.id}</div>
    <div class="stem">${esc(q.q)}</div>`;
  const listen = `<button class="btn small secondary" data-act="speakQ">Escuchar</button>`;
  if (!s.revealed) {
    return `${head}<div class="recall"><p class="muted">Piensa la respuesta antes de ver las opciones.</p><button class="btn" data-act="reveal">Ver opciones</button></div>${listen}`;
  }
  const opts = s.order.map((oi, pos) => {
    let cls = "";
    if (a) cls = oi === q.a ? "ok" : oi === a.choice ? "bad" : "";
    return `<button class="opt ${cls}" data-act="answer" data-arg="${oi}" ${a ? "disabled" : ""}><span class="k">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
  let after = listen;
  if (a) {
    const pos = s.order.indexOf(q.a);
    after = `<div class="feedback ${a.correct ? "ok" : "bad"}">${a.correct ? "Correcto" : `Incorrecto. La respuesta es la ${L[pos]}: ${esc(q.o[q.a])}`}</div>
      ${explBlock(q)}
      ${a.correct
        ? `<div class="label">¿Lo sabías?</div><div class="conf"><button class="btn k-sabia" data-act="conf" data-arg="sabia">Lo sabía</button><button class="btn k-dudaba" data-act="conf" data-arg="dudaba">Dudaba</button><button class="btn k-adivine" data-act="conf" data-arg="adivine">Adiviné</button></div>`
        : `<button class="btn" data-act="next">Siguiente</button>`}`;
  }
  return `${head}<div class="opts">${opts}</div>${after}`;
}
function vFin() {
  const s = ui.session;
  const [kind, x] = s.kind.split(":");
  const again = ["hoy", "extra", "tarea", "fallos", "dudosas"].includes(kind) && buildQueue(kind, x ? +x : undefined).length > 0;
  const r = readiness();
  return `<section class="panel">
    <div class="label">Tanda terminada</div>
    <div class="big num">${s.ok}/${s.done}</div>
    <p class="muted">respuestas correctas${s.done > s.ok ? ". Los fallos volverán a salir en unos minutos." : "."}</p>
    <p>Probabilidad de APTO ahora: <strong class="num">${pct(r.P)} %</strong></p>
  </section>
  ${again ? `<button class="btn" data-act="start" data-arg="${esc(s.kind)}">Otra tanda</button>` : ""}
  <button class="btn secondary" data-act="go" data-arg="hoy">Volver a Hoy</button>`;
}

/* ---------- Simulacro ---------- */
const simRemaining = () => (state.simRun ? state.simRun.start + SIM_MS - Date.now() : 0);
function simSubmit() {
  const r = state.simRun;
  if (!r) return;
  const d = today();
  const now = Date.now();
  const per = {};
  TK.forEach((k) => (per[k] = [0, 0]));
  let score = 0;
  for (const id of r.ids) {
    const q = QMAP.get(id);
    const ok = r.answers[id] === q.a;
    per[q.t][1]++;
    if (ok) { per[q.t][0]++; score++; }
    const c = ensure(id);
    if (!c.n) d.nu++;
    c.n++;
    c.last = now;
    c.t = now;
    c.lastOk = ok;
    if (ok) {
      c.ok++;
      if (c.L < 1) { c.L = 1; c.due = capDue(now + DAY); }
    } else {
      c.ko++;
      c.L = 0;
      c.conf = null;
      c.due = now;
    }
    d.n++;
    if (ok) d.ok++;
  }
  const rec = { id: r.id, date: now, score, per, secs: Math.round(Math.min(SIM_MS, now - r.start) / 1000), ids: r.ids, answers: r.answers };
  state.sims = [rec, ...state.sims].slice(0, 30);
  state.simRun = null;
  ui.simResult = rec.id;
  ui.simConfirm = false;
  save();
  go("simres");
}
function vSimulacro() {
  const hist = state.sims.map((s) => `<button class="hitem" data-act="simShow" data-arg="${s.id}"><span>${esc(fmtShort(s.date))}</span><span class="num">${s.score}/25</span><span class="state ${s.score >= 15 ? "s-dom" : "s-ko"}">${s.score >= 15 ? "APTO" : "NO APTO"}</span></button>`).join("");
  return `<h1 class="h1">Simulacro</h1>${simBanner()}
  <section class="panel">
    <p class="lead">25 preguntas con el reparto real del examen y 45 minutos de reloj.</p>
    <div class="dist">${TK.map((k) => `<span><b class="num">${TASKS[k].n}</b>T${k}</span>`).join("")}</div>
    <p class="muted">Con 15 aciertos, APTO. Los errores no restan, así que contesta todas. Las opciones salen en el orden del manual, como en el examen.</p>
    ${state.simRun ? "" : `<button class="btn" data-act="simStart">Empezar simulacro</button>`}
  </section>
  ${hist ? `<div class="label">Historial</div><div class="qlist">${hist}</div>` : ""}`;
}
function vSimRun() {
  const r = state.simRun;
  const q = QMAP.get(r.ids[r.cur]);
  const L = LET(q);
  const chosen = r.answers[q.id];
  const answered = r.ids.filter((id) => r.answers[id] != null).length;
  const rem = simRemaining();
  return `<div class="simbar"><span id="timer" class="timer num ${rem < 5 * MIN ? "low" : ""}">${fmtClock(rem)}</span><span class="qmeta">${answered}/25 respondidas</span><button class="btn small" data-act="simAsk">Entregar</button></div>
  ${ui.simConfirm ? `<section class="panel warnbox"><p><strong>Te quedan ${25 - answered} sin responder.</strong> Los errores no restan: conviene marcar algo en todas.</p><div class="duo"><button class="btn secondary" data-act="simCancelAsk">Seguir</button><button class="btn" data-act="simSubmit">Entregar igualmente</button></div></section>` : ""}
  <div class="qmeta">Tarea ${q.t} · Pregunta ${r.cur + 1} de 25</div>
  <div class="stem">${esc(q.q)}</div>
  <div class="opts">${q.o.map((o, oi) => `<button class="opt ${chosen === oi ? "sel" : ""}" data-act="simPick" data-arg="${oi}"><span class="k">${L[oi]}</span><span>${esc(o)}</span></button>`).join("")}</div>
  <div class="duo"><button class="btn secondary" data-act="simGo" data-arg="${r.cur - 1}" ${r.cur === 0 ? "disabled" : ""}>Anterior</button><button class="btn secondary" data-act="simGo" data-arg="${r.cur + 1}" ${r.cur === 24 ? "disabled" : ""}>Siguiente</button></div>
  <div class="label">Hoja de respuestas</div>
  <div class="sheet">${r.ids.map((id, j) => `<button class="${r.answers[id] != null ? "done" : ""} ${j === r.cur ? "cur" : ""}" data-act="simGo" data-arg="${j}" aria-label="Pregunta ${j + 1}">${j + 1}</button>`).join("")}</div>`;
}
function vSimRes() {
  const s = state.sims.find((x) => x.id === ui.simResult) || state.sims[0];
  if (!s) return vSimulacro();
  const apto = s.score >= 15;
  const wrong = s.ids.filter((id) => s.answers[id] !== QMAP.get(id).a);
  const review = s.ids.map((id, j) => {
    const q = QMAP.get(id);
    const L = LET(q);
    const a = s.answers[id];
    const ok = a === q.a;
    return `<details class="rev"><summary><span class="num">${j + 1}</span><span>${esc(q.q)}</span><span class="state ${ok ? "s-dom" : "s-ko"}">${ok ? "Bien" : a == null ? "En blanco" : "Mal"}</span></summary>
      <div class="opts small">${q.o.map((o, oi) => `<div class="opt ${oi === q.a ? "ok" : oi === a ? "bad" : ""}"><span class="k">${L[oi]}</span><span>${esc(o)}</span></div>`).join("")}</div>${explBlock(q)}</details>`;
  }).join("");
  return `<section class="verdict ${apto ? "" : "no"}"><span class="label">Resultado · ${esc(fmtShort(s.date))}</span><span class="v">${apto ? "APTO" : "NO APTO"}</span><span><strong class="num">${s.score}</strong> de 25 · mínimo 15 · ${fmtClock(s.secs * 1000)} de 45:00</span></section>
  <section class="panel"><div class="taskbars">${TK.map((k) => {
    const [ok, n] = s.per[k];
    return `<div class="taskbar"><span>T${k} · ${TASKS[k].short}</span><span class="bar"><i style="width:${(ok / n) * 100}%"></i></span><span class="num">${ok}/${n}</span></div>`;
  }).join("")}</div></section>
  ${wrong.length ? `<button class="btn" data-act="start" data-arg="ids:${wrong.join(",")}">Repasar ${wrong.length} ${wrong.length === 1 ? "fallo" : "fallos"}</button>` : ""}
  <button class="btn secondary" data-act="go" data-arg="simulacro">Volver a Simulacro</button>
  <div class="label">Revisión pregunta a pregunta</div><div class="revlist">${review}</div>`;
}
